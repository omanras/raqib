# The rig (ADR-0012): Raqib on a real machine, watching a stand-in agent whose acts are known, on every push.
# Windows with a real Sysmon (installed here, all events of the kinds Raqib reads), and Linux. tools/rig/check.py
# states each expectation as MET, MISSED or OPEN; the job reports and does not fail on a MISSED one (the gate is
# what decides a merge). It needs no secret; it downloads Sysmon from Microsoft and talks to two public hosts.
name: rig

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: rig (windows, Sysmon)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: install Sysmon
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          "Sysmon.zip sha256 " + (Get-FileHash $env:RUNNER_TEMP\Sysmon.zip -Algorithm SHA256).Hash
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          Start-Sleep 3
      - name: watch the host while the stand-in agent works
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\watch.out"; $err = "$env:RUNNER_TEMP\watch.err"
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","16","--every","5","--no-open" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep 7
          python tools\rig\workload.py | Tee-Object -FilePath $env:RUNNER_TEMP\workload.out
          $w.WaitForExit(180000) | Out-Null
          "code=$($w.ExitCode)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "=== the watch's report"; Get-Content $out
          "=== the watch's stderr"; Get-Content $err
      - name: read the report against what the stand-in did
        shell: pwsh
        run: python tools\rig\check.py --report $env:RUNNER_TEMP\watch.out --workload $env:RUNNER_TEMP\workload.out --sources $HOME\.raqib\host\sources --exit-code $env:code --platform win32 --sysmon --summary $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-windows
          path: |
            ${{ runner.temp }}/watch.out
            ${{ runner.temp }}/watch.err
            ${{ runner.temp }}/workload.out
            ~/.raqib/host/sources/
          if-no-files-found: ignore

  linux:
    name: rig (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: watch the host while the stand-in agent works
        run: |
          raqib watch --host --rounds 16 --every 5 --no-open > "$RUNNER_TEMP/watch.out" 2> "$RUNNER_TEMP/watch.err" &
          w=$!
          sleep 7
          python tools/rig/workload.py | tee "$RUNNER_TEMP/workload.out"
          code=0; wait $w || code=$?
          echo "code=$code" >> "$GITHUB_ENV"
          echo "=== the watch's report"; cat "$RUNNER_TEMP/watch.out"
          echo "=== the watch's stderr"; cat "$RUNNER_TEMP/watch.err"
      - name: read the report against what the stand-in did
        run: python tools/rig/check.py --report "$RUNNER_TEMP/watch.out" --workload "$RUNNER_TEMP/workload.out" --sources "$HOME/.raqib/host/sources" --exit-code "$code" --platform linux --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-linux
          path: |
            ${{ runner.temp }}/watch.out
            ${{ runner.temp }}/watch.err
            ${{ runner.temp }}/workload.out
          if-no-files-found: ignore
