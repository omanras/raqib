# The rig (ADR-0012): Raqib on a real machine, watching a stand-in agent whose acts are known, on every push.
# Windows with a real Sysmon (installed here, all events of the kinds Raqib reads), and Linux. tools/rig/check.py
# states each expectation as MET, MISSED or OPEN; the job reports and does not fail on a MISSED one (the gate is
# what decides a merge). It needs no secret; it downloads Sysmon from Microsoft and talks to two public hosts.
# The forwarder (ADR-0011 J-14) sends the watch's events file to a stand-in collector on loopback, with a
# made-up token that tools/rig/forward_run.py makes for the run (X19 to X22), and over syslog to a stand-in
# syslog collector on loopback, over tcp and udp (tools/rig/syslog_collector.py; X23 to X25, J-6). It and the
# check step run always (ADR-0011 L-10): whatever the watch or the forwarder did, the table is written.
# The service (ADR-0013 A-9, AA-3): on Linux, as root, tools/rig/service_run.py tries an install from a place
# every user can write (X28), installs from a place root's alone and runs the stand-in as a second user (X29),
# and removes (X30); on Windows it runs nothing and says so. The unit and its record are removed by the run.
# --throwaway: the tool makes a user, installs a unit of the system's and runs root's code from a place every user
# can write; it is for a machine that is thrown away after the run, and runs nothing without the word.
# The rules of behaviour (ADR-0014, ADR-0012 Amendment A): on Windows the stand-in leaves a file in its Startup
# folder, reaches port 22 of the machine's own address and sets a value under its Run key, each harmless and each
# undone; X32 to X34 say whether each was a finding of its tree.
# The chain (ADR-0016 H-4, M13.1): after the watch, `raqib events` runs over its events file and its answer is kept;
# X38 says whether the line of this watch's run says its chain is whole and no line names a break.
# The packed watch (ADR-0007 CG-3, M17.2a): on Linux the job installs PyInstaller 6.11.1 (the job's tool, never a
# dependency of Raqib), packs the installed Raqib into one folder (tools/rig/pack.sh), runs its host watch of four
# rounds with a home of its own, and X47 says whether its every ask was answered and no helper ended.
# Whose the code is (ADR-0013 K-8, M12.4c1): on Windows the job packs the installed Raqib the same way
# (tools/rig/service_check.ps1), copies the folder into Program Files, and asks `raqib service check` of that copy
# and of the one in the job's own folder; X49 says whether the first was taken and the second refused. The check
# changes nothing; the copy is removed by the run. A plain interpreter (ADR-0013 M-6, M12.4c1b): the job copies
# its own Python, Raqib in it, into Program Files (tools/rig/service_check_plain.ps1) and asks the copy and its own
# Python, each with -I; X50 says whether the copy was taken and the job's own Python refused. The drive
# (ADR-0013 P-3, M12.4c2a): the job gives a letter to the folder of a packed copy in Program Files
# (tools/rig/service_check_drive.ps1) and asks the copy through it; X51 says whether it was refused for what the
# letter names. The letter and the copy are removed by the run. The service asks (ADR-0013 T-3, M12.4c2b1): the
# runner asks that check of its own code at every start, so the job's service (X48) is made from a copy of its
# Python under Program Files, and tools/rig/service_refused.ps1 makes one more from the job's own Python and one
# from such a copy; X52 says whether the first failed to start with the service's own number 15, its text file
# naming what was refused, and the second ran with the pass in its text file. Both are removed by the run.
# The status (ADR-0013 V-5, W-6, M12.4c2b2a): tools/rig/service_status.ps1 makes a local user outside the
# administrators' group and has it ask `raqib service status` with no service of the name, with the job's service
# running and with one refused at its start; X53 says whether it was answered NOT INSTALLED, ACTIVE and installed
# and not active with 15's words. The user, the services and the copy are removed by the run.
# The install (ADR-0013 X-7, Y-6, M12.4c2b2b): tools/rig/service_install.ps1 asks Raqib's own install to install
# from the job's own Python (the check refuses: nothing made), then from a copy under Program Files (made, started,
# ACTIVE as a user with no rights reads it), then to remove it; X54 says whether each was so. All removed by the run.
# The check-point (ADR-0013 ZB, M12.4c2b3): tools/rig/service_point.ps1 makes a service from a copy of the job's
# Python under Program Files with 100000 empty files added, so that the check of its own code walks for seconds,
# and starts it by the system's own call, asking the system what it says while it starts, and then by `net start`;
# X55 says whether a check-point above 0 was read and `net start` ended with 0. All removed by the run.
name: rig

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: rig (windows, Sysmon)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: install Sysmon
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          "Sysmon.zip sha256 " + (Get-FileHash $env:RUNNER_TEMP\Sysmon.zip -Algorithm SHA256).Hash
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          Start-Sleep 3
      - name: watch the host while the stand-in agent works
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\watch.out"; $err = "$env:RUNNER_TEMP\watch.err"
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","16","--every","5","--no-open" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep 7
          python tools\rig\workload.py | Tee-Object -FilePath $env:RUNNER_TEMP\workload.out
          $w.WaitForExit(180000) | Out-Null
          "code=$($w.ExitCode)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "=== the watch's report"; Get-Content $out
          "=== the watch's stderr"; Get-Content $err
      - name: check the chain of the watch's events file with raqib events, its answer kept (X38)
        if: always()
        shell: pwsh
        run: |
          raqib events $HOME\.raqib\host\events.jsonl > $env:RUNNER_TEMP\events-check.out 2> $env:RUNNER_TEMP\events-check.err
          "=== raqib events (exit $LASTEXITCODE)"; Get-Content $env:RUNNER_TEMP\events-check.out
          "=== its error stream"; Get-Content $env:RUNNER_TEMP\events-check.err -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force rig-out | Out-Null
          Copy-Item $env:RUNNER_TEMP\events-check.err rig-out -ErrorAction SilentlyContinue
          exit 0
      - name: forward the watch's events to stand-in collectors on loopback, HTTP and syslog (X19 to X25)
        if: always()
        shell: pwsh
        run: python tools\rig\forward_run.py --events $HOME\.raqib\host\events.jsonl --out $env:RUNNER_TEMP\forward.json
      - name: the service is Linux's for now (X28 to X30 said as not run)
        if: always()
        shell: pwsh
        run: python tools\rig\service_run.py --out $env:RUNNER_TEMP\service.json
      - name: the process events are Linux's (X31 said as not run)
        if: always()
        shell: pwsh
        run: python tools\rig\procevents_run.py --out $env:RUNNER_TEMP\procevents.json
      - name: the watch as a service of Windows, its process ended from outside and started again by the system (X48)
        if: always()
        shell: pwsh
        run: tools\rig\service_again.ps1 -Out $env:RUNNER_TEMP\service-again
      - name: the service asks whose its own code is at its start - made from the job's own Python it does not run, from a copy in Program Files it does (X52)
        if: always()
        shell: pwsh
        run: tools\rig\service_refused.ps1 -Out $env:RUNNER_TEMP\service-refused
      - name: raqib service status asked by a user with no rights - no service, the job's service running, one refused at its start (X53)
        if: always()
        shell: pwsh
        run: tools\rig\service_status.ps1 -Out $env:RUNNER_TEMP\service-status
      - name: raqib service install and remove - refused from the job's own Python, installed from a copy in Program Files and running, removed (X54)
        if: always()
        shell: pwsh
        run: tools\rig\service_install.ps1 -Out $env:RUNNER_TEMP\service-install
      - name: the service raises its check-point while its check walks a tree made large - asked of the system as it starts, and started by net start (X55)
        if: always()
        shell: pwsh
        run: tools\rig\service_point.ps1 -Out $env:RUNNER_TEMP\service-point
      - name: whose the code a service would run is, asked of a packed Raqib in Program Files and of one in the job's folder (X49; the packer is this job's, never Raqib's)
        if: always()
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q pyinstaller==6.11.1
          tools\rig\service_check.ps1 -Out $env:RUNNER_TEMP\service-check
      - name: the same question of a plain interpreter, a copy of this job's Python in Program Files and the job's own (X50)
        if: always()
        shell: pwsh
        run: tools\rig\service_check_plain.ps1 -Out $env:RUNNER_TEMP\service-check-plain
      - name: the same question through a letter given to the packed copy's folder (X51)
        if: always()
        shell: pwsh
        run: tools\rig\service_check_drive.ps1 -Packed $env:RUNNER_TEMP\service-check\pack\dist\raqib -Out $env:RUNNER_TEMP\service-check-drive
      - name: the autostart places read by Raqib itself beside a second run of the stand-in (X37)
        if: always()
        shell: pwsh
        run: python tools\rig\autostart_run.py --out $env:RUNNER_TEMP\autostart.json
      - name: read the report against what the stand-in did
        if: always()
        shell: pwsh
        run: python tools\rig\check.py --report $env:RUNNER_TEMP\watch.out --workload $env:RUNNER_TEMP\workload.out --sources $HOME\.raqib\host\sources --exit-code $env:code --platform win32 --sysmon --events $HOME\.raqib\host\events.jsonl --forward $env:RUNNER_TEMP\forward.json --service $env:RUNNER_TEMP\service.json --procevents $env:RUNNER_TEMP\procevents.json --autostart $env:RUNNER_TEMP\autostart.json --events-check $env:RUNNER_TEMP\events-check.out --service-run $env:RUNNER_TEMP\service-again\service-run.txt --service-check $env:RUNNER_TEMP\service-check\service-check.txt --service-check-plain $env:RUNNER_TEMP\service-check-plain\service-check-plain.txt --service-check-drive $env:RUNNER_TEMP\service-check-drive\service-check-drive.txt --service-refused $env:RUNNER_TEMP\service-refused\service-refused.txt --service-status $env:RUNNER_TEMP\service-status\service-status.txt --service-install $env:RUNNER_TEMP\service-install\service-install.txt --service-point $env:RUNNER_TEMP\service-point\service-point.txt --service-events $env:RUNNER_TEMP\service-again\service-events.jsonl --summary $env:GITHUB_STEP_SUMMARY
      - name: gather what the watch wrote
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rig-out | Out-Null
          Copy-Item $env:RUNNER_TEMP\watch.out, $env:RUNNER_TEMP\watch.err, $env:RUNNER_TEMP\workload.out rig-out -ErrorAction SilentlyContinue
          Copy-Item $HOME\.raqib\host\sources rig-out\sources -Recurse -ErrorAction SilentlyContinue
          Copy-Item $HOME\.raqib\host\events.jsonl rig-out -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\forward.json, $env:RUNNER_TEMP\autostart.json rig-out -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\events-check.out rig-out -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-again rig-out\service-again -Recurse -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-refused rig-out\service-refused -Recurse -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-point rig-out\service-point -Recurse -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-status rig-out\service-status -Recurse -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-install rig-out\service-install -Recurse -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-check\service-check.txt rig-out -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-check-plain\service-check-plain.txt rig-out -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\service-check-drive\service-check-drive.txt rig-out -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-windows
          path: rig-out/
          if-no-files-found: ignore

  linux:
    name: rig (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: watch the host while the stand-in agent works
        run: |
          raqib watch --host --rounds 16 --every 5 --no-open > "$RUNNER_TEMP/watch.out" 2> "$RUNNER_TEMP/watch.err" &
          w=$!
          sleep 7
          python tools/rig/workload.py | tee "$RUNNER_TEMP/workload.out"
          code=0; wait $w || code=$?
          echo "code=$code" >> "$GITHUB_ENV"
          echo "=== the watch's report"; cat "$RUNNER_TEMP/watch.out"
          echo "=== the watch's stderr"; cat "$RUNNER_TEMP/watch.err"
      - name: check the chain of the watch's events file with raqib events, its answer kept (X38)
        if: always()
        run: |
          code=0; raqib events "$HOME/.raqib/host/events.jsonl" > "$RUNNER_TEMP/events-check.out" 2>&1 || code=$?
          echo "=== raqib events (exit $code)"; cat "$RUNNER_TEMP/events-check.out"
      - name: forward the watch's events to stand-in collectors on loopback, HTTP and syslog (X19 to X25)
        if: always()
        run: python tools/rig/forward_run.py --events "$HOME/.raqib/host/events.jsonl" --out "$RUNNER_TEMP/forward.json"
      - name: the service as root, a unit of the system's (X28 to X30)
        if: always()
        run: |
          sudo /usr/bin/python3 tools/rig/service_run.py --throwaway --out "$RUNNER_TEMP/service.json" || true
          sudo chmod 0644 "$RUNNER_TEMP/service.json" || true
          echo "=== what the service run saw"; cat "$RUNNER_TEMP/service.json" || true
      - name: the reader of the kernel's process events hears short acts (X31)
        if: always()
        run: python tools/rig/procevents_run.py --out "$RUNNER_TEMP/procevents.json" || true
      - name: the autostart places are Windows' (X37 said as n/a)
        if: always()
        run: python tools/rig/autostart_run.py --out "$RUNNER_TEMP/autostart.json" || true
      - name: a Raqib packed with its own runtime, its host watch (X47; the packer is this job's, never Raqib's)
        if: always()
        run: |
          python -m pip install --disable-pip-version-check -q pyinstaller==6.11.1 || echo "the packer could not be installed"
          exe=$(PYTHON=python tools/rig/pack.sh "$RUNNER_TEMP/pack") || echo "the packing failed: no packed watch"
          if [ -n "$exe" ] && [ -x "$exe" ]; then
            mkdir -p "$RUNNER_TEMP/packed-home"
            HOME="$RUNNER_TEMP/packed-home" "$exe" watch --host --rounds 4 --every 3 --no-open --no-page > "$RUNNER_TEMP/packed.out" 2> "$RUNNER_TEMP/packed.err" &
            w=$!
            sleep 2; for i in 1 2 3 4 5 6; do /bin/true; sleep 1; done   # CH-2: six short processes for its reader to hear
            wait $w || echo "the packed watch's exit: $?"
          fi
          touch "$RUNNER_TEMP/packed.out" "$RUNNER_TEMP/packed.err"
          echo "=== the packed watch's report"; cat "$RUNNER_TEMP/packed.out"
          echo "=== its error stream"; head -20 "$RUNNER_TEMP/packed.err"
      - name: read the report against what the stand-in did
        if: always()
        run: python tools/rig/check.py --report "$RUNNER_TEMP/watch.out" --workload "$RUNNER_TEMP/workload.out" --sources "$HOME/.raqib/host/sources" --exit-code "$code" --platform linux --events "$HOME/.raqib/host/events.jsonl" --forward "$RUNNER_TEMP/forward.json" --service "$RUNNER_TEMP/service.json" --procevents "$RUNNER_TEMP/procevents.json" --autostart "$RUNNER_TEMP/autostart.json" --events-check "$RUNNER_TEMP/events-check.out" --packed "$RUNNER_TEMP/packed.out" --summary "$GITHUB_STEP_SUMMARY"
      - name: gather what the watch wrote
        if: always()
        run: |
          mkdir -p rig-out
          cp "$RUNNER_TEMP/watch.out" "$RUNNER_TEMP/watch.err" "$RUNNER_TEMP/workload.out" rig-out/ 2>/dev/null || true
          cp -r "$HOME/.raqib/host/sources" rig-out/sources 2>/dev/null || true
          cp "$HOME/.raqib/host/events.jsonl" rig-out/ 2>/dev/null || true
          cp "$RUNNER_TEMP/forward.json" "$RUNNER_TEMP/service.json" "$RUNNER_TEMP/procevents.json" "$RUNNER_TEMP/autostart.json" rig-out/ 2>/dev/null || true
          cp "$RUNNER_TEMP/events-check.out" "$RUNNER_TEMP/packed.out" "$RUNNER_TEMP/packed.err" rig-out/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/packed-home/.raqib/host" rig-out/packed-host 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-linux
          path: rig-out/
          if-no-files-found: ignore

  siem:
    # ADR-0017 S-2 (M16.1 E6): the ready content of siem/, proved by the engines themselves. Each engine runs in a
    # container published on this machine's own loopback port and nowhere else; tools/rig/siem_run.py installs
    # the content, puts the examples of docs/specs/EVENT.md and a short host watch's own events file through it,
    # and prints X39 to X42, each MET or MISSED with its numbers. A MISSED claim does not fail the job (ADR-0012);
    # an engine that did not start, or a sigma-cli that could not be installed, is said as such, never as MET.
    # Nothing is sent off the machine; what comes in is the engines' images and sigma-cli, for this job only.
    # REDO (Amendment A, SA-10): the watch says heartbeats (a beat of 5 s); sigma-cli, pySigma and the two backends
    # are pinned to the set pip resolves for Python 3.12 (the versions are printed in X42's row); the runner feeds
    # made-up events and near misses, the made-up hosts of the silence measurement, the odd lines and a shipper's
    # fields beside the examples and the watch's file.
    name: rig siem (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [elasticsearch, opensearch]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the engine, on this machine's own port and nowhere else
        run: |
          if [ "${{ matrix.engine }}" = elasticsearch ]; then
            docker run -d --name engine -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e ES_JAVA_OPTS="-Xms1g -Xmx1g" docker.elastic.co/elasticsearch/elasticsearch:8.15.3 || echo "the engine could not be started"
          else
            docker run -d --name engine -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true -e OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g" opensearchproject/opensearch:2.17.1 || echo "the engine could not be started"
          fi
      - name: a short host watch's own events file
        run: |
          python -m pip install --disable-pip-version-check -q .
          raqib watch --host --rounds 4 --every 5 --beat 5 --no-open > "$RUNNER_TEMP/watch.out" 2>&1 || echo "the watch's exit: $?"
          ls -la "$HOME/.raqib/host/" || true
      - name: sigma-cli, for this job only (never a dependency of raqib)
        run: python -m pip install --disable-pip-version-check -q sigma-cli==3.1.0 pySigma==1.5.1 pysigma-backend-elasticsearch==2.1.1 pysigma-backend-opensearch==2.0.3 || echo "sigma-cli could not be installed"
      - name: the content through the engine (X39 to X42)
        if: always()
        run: |
          python tools/rig/siem_run.py docs/specs/EVENT.md "$HOME/.raqib/host/events.jsonl" --summary "$GITHUB_STEP_SUMMARY" || echo "the runner's exit: $?"
          echo "=== the engine's last words"; docker logs --tail 30 engine 2>&1 || true
