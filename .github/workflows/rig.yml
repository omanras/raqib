# The rig (ADR-0012): Raqib on a real machine, watching a stand-in agent whose acts are known, on every push.
# Windows with a real Sysmon (installed here, all events of the kinds Raqib reads), and Linux. tools/rig/check.py
# states each expectation as MET, MISSED or OPEN; the job reports and does not fail on a MISSED one (the gate is
# what decides a merge). It needs no secret; it downloads Sysmon from Microsoft and talks to two public hosts.
# The forwarder (ADR-0011 J-14) sends the watch's events file to a stand-in collector on loopback, with a
# made-up token that tools/rig/forward_run.py makes for the run (X19 to X22), and over syslog to a stand-in
# syslog collector on loopback, over tcp and udp (tools/rig/syslog_collector.py; X23 to X25, J-6). It and the
# check step run always (ADR-0011 L-10): whatever the watch or the forwarder did, the table is written.
name: rig

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: rig (windows, Sysmon)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: install Sysmon
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          "Sysmon.zip sha256 " + (Get-FileHash $env:RUNNER_TEMP\Sysmon.zip -Algorithm SHA256).Hash
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          Start-Sleep 3
      - name: watch the host while the stand-in agent works
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\watch.out"; $err = "$env:RUNNER_TEMP\watch.err"
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","16","--every","5","--no-open" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep 7
          python tools\rig\workload.py | Tee-Object -FilePath $env:RUNNER_TEMP\workload.out
          $w.WaitForExit(180000) | Out-Null
          "code=$($w.ExitCode)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "=== the watch's report"; Get-Content $out
          "=== the watch's stderr"; Get-Content $err
      - name: forward the watch's events to stand-in collectors on loopback, HTTP and syslog (X19 to X25)
        if: always()
        shell: pwsh
        run: python tools\rig\forward_run.py --events $HOME\.raqib\host\events.jsonl --out $env:RUNNER_TEMP\forward.json
      - name: read the report against what the stand-in did
        if: always()
        shell: pwsh
        run: python tools\rig\check.py --report $env:RUNNER_TEMP\watch.out --workload $env:RUNNER_TEMP\workload.out --sources $HOME\.raqib\host\sources --exit-code $env:code --platform win32 --sysmon --events $HOME\.raqib\host\events.jsonl --forward $env:RUNNER_TEMP\forward.json --summary $env:GITHUB_STEP_SUMMARY
      - name: gather what the watch wrote
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rig-out | Out-Null
          Copy-Item $env:RUNNER_TEMP\watch.out, $env:RUNNER_TEMP\watch.err, $env:RUNNER_TEMP\workload.out rig-out -ErrorAction SilentlyContinue
          Copy-Item $HOME\.raqib\host\sources rig-out\sources -Recurse -ErrorAction SilentlyContinue
          Copy-Item $HOME\.raqib\host\events.jsonl rig-out -ErrorAction SilentlyContinue
          Copy-Item $env:RUNNER_TEMP\forward.json rig-out -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-windows
          path: rig-out/
          if-no-files-found: ignore

  linux:
    name: rig (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: watch the host while the stand-in agent works
        run: |
          raqib watch --host --rounds 16 --every 5 --no-open > "$RUNNER_TEMP/watch.out" 2> "$RUNNER_TEMP/watch.err" &
          w=$!
          sleep 7
          python tools/rig/workload.py | tee "$RUNNER_TEMP/workload.out"
          code=0; wait $w || code=$?
          echo "code=$code" >> "$GITHUB_ENV"
          echo "=== the watch's report"; cat "$RUNNER_TEMP/watch.out"
          echo "=== the watch's stderr"; cat "$RUNNER_TEMP/watch.err"
      - name: forward the watch's events to stand-in collectors on loopback, HTTP and syslog (X19 to X25)
        if: always()
        run: python tools/rig/forward_run.py --events "$HOME/.raqib/host/events.jsonl" --out "$RUNNER_TEMP/forward.json"
      - name: read the report against what the stand-in did
        if: always()
        run: python tools/rig/check.py --report "$RUNNER_TEMP/watch.out" --workload "$RUNNER_TEMP/workload.out" --sources "$HOME/.raqib/host/sources" --exit-code "$code" --platform linux --events "$HOME/.raqib/host/events.jsonl" --forward "$RUNNER_TEMP/forward.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: gather what the watch wrote
        if: always()
        run: |
          mkdir -p rig-out
          cp "$RUNNER_TEMP/watch.out" "$RUNNER_TEMP/watch.err" "$RUNNER_TEMP/workload.out" rig-out/ 2>/dev/null || true
          cp -r "$HOME/.raqib/host/sources" rig-out/sources 2>/dev/null || true
          cp "$HOME/.raqib/host/events.jsonl" rig-out/ 2>/dev/null || true
          cp "$RUNNER_TEMP/forward.json" rig-out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-linux
          path: rig-out/
          if-no-files-found: ignore
