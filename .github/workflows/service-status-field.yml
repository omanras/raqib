name: service-status-field
# Probe only (never merged): the thirteenth measurement - a branch's `raqib service status` on real Windows
# (ADR-0013 Amendment V), asked by an administrator and by a plain user.
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/svc_status_field.ps1, .github/workflows/service-status-field.yml]
permissions:
  contents: read
env:
  RAQIB_REF: claude/M12.4c2b2a
jobs:
  field:
    name: raqib service status on real Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the branch's Raqib and its tests
        shell: bash
        run: |
          git fetch -q --depth 1 origin "$RAQIB_REF"
          git checkout -q FETCH_HEAD -- raqib tests docs pyproject.toml tools/rig/check.py
          git rev-parse --short FETCH_HEAD
          python -m pip install --disable-pip-version-check -q . pytest
      - name: the status's, the runner's and the libraries' tests on this machine
        shell: pwsh
        run: |
          python -m pytest tests/test_winmanager.py tests/test_winservice.py tests/test_libraries.py -q -rs 2>&1 | Select-Object -Last 10
          exit 0
      - name: asked in the field
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_status_field.ps1"
