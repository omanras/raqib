# The real-agents probe (never merged; the commander's word of 2026-11-13: run the agents on GitHub's machines,
# without asking each time). A real agent CLI is installed on the runner and pointed at tools/rig/model.py, a
# scripted model on the runner itself that asks for three fixed commands (curl, curl, whoami). No key, no secret,
# read-only permissions; the machine is thrown away after the job.
name: agents-probe
on:
  push:
    branches: [claude/rig-probe]
    paths-ignore: [tools/rig/packed_probe.py, tools/rig/mac_probe.py, tools/rig/window_probe.py, "tools/rig/packed_env_*", "tools/rig/svc_probe*", tools/rig/svc_field.ps1, .github/workflows/service-probe5.yml, .github/workflows/service-probe6.yml, tools/rig/svc_kill.ps1, tools/rig/svc_probe7.ps1, tools/rig/svc_probe8.ps1, .github/workflows/service-probe8.yml, .github/workflows/service-probe9.yml, .github/workflows/service-probe10.yml, .github/workflows/service-probe9b.yml, tools/rig/svc_check_field.ps1, .github/workflows/service-check-field.yml, tools/rig/svc_check_drive_field.ps1, tools/rig/svc_letter.py, .github/workflows/service-check-drive-field.yml, tools/rig/svc_check_plain_field.ps1, tools/rig/svc_check_system.ps1, tools/rig/svc_start_check.ps1, tools/rig/svc_start_stop.ps1, tools/rig/svc_status_field.ps1, .github/workflows/service-probe14.yml, .github/workflows/service-status-field.yml, .github/workflows/service-start-stop.yml, .github/workflows/service-start-check.yml, .github/workflows/service-check-system.yml, .github/workflows/service-check-plain-field.yml, .github/workflows/service-probe7.yml, .github/workflows/service-kill.yml, .github/workflows/service-field.yml, .github/workflows/service-probe.yml, .github/workflows/platform-probe.yml, .github/workflows/window-probe.yml, .github/workflows/packed-env-probe.yml, .github/workflows/agents-probe.yml]
permissions:
  contents: read
env:
  RIG_CLOSE: "1"   # the model ends the connection with each answer: one connection per turn
jobs:
  linux:
    name: agents (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install raqib and the agents
        run: |
          python -m pip install --disable-pip-version-check .
          npm install -g @qwen-code/qwen-code || echo "qwen: install failed"
          npm install -g opencode-ai || echo "opencode: install failed"
          python -m pip install --disable-pip-version-check kimi-cli || echo "kimi: install failed"
          qwen --version || true; opencode --version || true; kimi --version || true
      - name: the scripted model
        run: |
          ip=$(hostname -I | awk '{print $1}')
          echo "RIG_URL=http://$ip:8790/v1" >> "$GITHUB_ENV"
          nohup python tools/rig/model.py --port 8790 --log "$RUNNER_TEMP/model.log" > /dev/null 2>&1 &
          sleep 2; curl -s "http://$ip:8790/v1/models"; echo
      - name: qwen under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-qwen" && cd "$RUNNER_TEMP/w-qwen"
          raqib watch --host --rounds 30 --every 5 --no-open > ../watch-qwen.out 2> ../watch-qwen.err &
          w=$!; sleep 7
          OPENAI_API_KEY=rig OPENAI_BASE_URL="$RIG_URL" OPENAI_MODEL=rig-model timeout 130 qwen -p "Do the task." --yolo > ../agent-qwen.out 2>&1 || echo "qwen rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-qwen.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"; : > "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-qwen.out
          echo "=== rhythm"; python "$GITHUB_WORKSPACE/tools/rig/rhythm_read.py" node qwen opencode bun curl || true
      - name: what an agent's tree does with its processes (M14.1d, measured before ADR-0007 BZ-3 is ruled)
        continue-on-error: true
        run: |
          sudo apt-get install -y -q strace > /dev/null 2>&1 || echo "strace: install failed"
          echo "=== the network tools' own files"
          for t in curl wget nc netcat telnet ftp ssh scp sftp rsync git busybox sh; do p=$(command -v $t || true); [ -n "$p" ] && echo "$t: $p -> $(readlink -f "$p")" || echo "$t: not here"; done
          echo "=== the common idioms of a shell tool"
          strace -f -ttt -qq -e trace=execve,clone,clone3,fork,vfork,exit_group -o "$RUNNER_TEMP/idioms.trace" bash tools/rig/idioms.sh || true
          python tools/rig/exec_probe.py "$RUNNER_TEMP/idioms.trace" idioms
          echo "=== qwen's own tree, a run of its task"
          mkdir -p "$RUNNER_TEMP/s-qwen" && cd "$RUNNER_TEMP/s-qwen"
          OPENAI_API_KEY=rig OPENAI_BASE_URL="$RIG_URL" OPENAI_MODEL=rig-model strace -f -ttt -qq -e trace=execve,clone,clone3,fork,vfork,exit_group -o "$RUNNER_TEMP/qwen.trace" timeout 120 qwen -p "Do the task." --yolo > ../strace-qwen.out 2>&1 || echo "qwen rc=$?"
          python "$GITHUB_WORKSPACE/tools/rig/exec_probe.py" "$RUNNER_TEMP/qwen.trace" qwen; : > "$RUNNER_TEMP/model.log"
          echo "=== kimi's own tree, a run of its task"
          mkdir -p "$RUNNER_TEMP/s-kimi" && cd "$RUNNER_TEMP/s-kimi"
          KIMI_API_KEY=rig KIMI_BASE_URL="$RIG_URL" KIMI_MODEL_NAME=rig-model strace -f -ttt -qq -e trace=execve,clone,clone3,fork,vfork,exit_group -o "$RUNNER_TEMP/kimi.trace" timeout 80 kimi --print -p "Do the task." --yolo > ../strace-kimi.out 2>&1 || echo "kimi rc=$?"
          python "$GITHUB_WORKSPACE/tools/rig/exec_probe.py" "$RUNNER_TEMP/kimi.trace" kimi; : > "$RUNNER_TEMP/model.log"
      - name: kimi under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-kimi" && cd "$RUNNER_TEMP/w-kimi"
          raqib watch --host --rounds 30 --every 5 --no-open > ../watch-kimi.out 2> ../watch-kimi.err &
          w=$!; sleep 7
          KIMI_API_KEY=rig KIMI_BASE_URL="$RIG_URL" KIMI_MODEL_NAME=rig-model timeout 80 kimi --print -p "Do the task." --yolo > ../agent-kimi.out 2>&1 || echo "kimi rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-kimi.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"; : > "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-kimi.out
      - name: opencode under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-opencode" && cd "$RUNNER_TEMP/w-opencode"
          cat > opencode.json <<JSON
          {"\$schema": "https://opencode.ai/config.json",
           "provider": {"rig": {"npm": "@ai-sdk/openai-compatible", "name": "Rig",
                                "options": {"baseURL": "$RIG_URL", "apiKey": "rig"},
                                "models": {"rig-model": {"name": "Rig"}}}},
           "model": "rig/rig-model", "permission": {"bash": "allow", "edit": "allow"}}
          JSON
          raqib watch --host --rounds 30 --every 5 --no-open > ../watch-opencode.out 2> ../watch-opencode.err &
          w=$!; sleep 7
          timeout 130 opencode run "Do the task." > ../agent-opencode.out 2>&1 || echo "opencode rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-opencode.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"
          echo "=== rhythm"; python "$GITHUB_WORKSPACE/tools/rig/rhythm_read.py" node qwen opencode bun curl || true
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-opencode.out

  service:
    name: the watch as a unit of the system's (M12, the service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the service as M12.1 builds it, and what its review asked to be measured
        run: bash tools/rig/service_probe2.sh
  journal:
    name: what the journal takes (M10.3c, ADR-0011 W)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the native protocol from a user's process
        run: |
          id
          python3 tools/rig/journal_probe.py
  eventlog:
    name: what the Windows event log takes (M10.3c, ADR-0011 W)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ReportEventW by a source nobody registered
        shell: pwsh
        run: python tools/rig/eventlog_probe.py
  etw:
    name: the tracing reader in the field (M7.21a, ADR-0007 BL)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the structures' sizes as this system's ctypes lays them
        shell: pwsh
        run: |
          python -c "import ctypes; from raqib import etwnet as e; print({n: ctypes.sizeof(getattr(e, n)) for n in dir(e) if isinstance(getattr(e, n), type) and issubclass(getattr(e, n), ctypes.Structure) and getattr(e, n) is not ctypes.Structure})"
      - name: the reader over real traffic (remote and loopback)
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1" -PassThru -WindowStyle Hidden
          $job = Start-Process python -ArgumentList "tools/rig/etw_read.py","14" -PassThru -NoNewWindow -RedirectStandardOutput read.txt -RedirectStandardError read.err
          Start-Sleep -Seconds 4
          logman query -ets | Select-String "raqib"
          curl.exe -s -o NUL -w "remote https: sent %{size_request} got %{size_download} from %{local_ip}:%{local_port} to %{remote_ip}:%{remote_port}\n" https://example.com/
          curl.exe -s -o NUL -w "remote http: sent %{size_request} got %{size_download} from %{local_ip}:%{local_port} to %{remote_ip}:%{remote_port}\n" http://example.com/
          curl.exe -s -o NUL -w "loopback: sent %{size_request} got %{size_download} from %{local_ip}:%{local_port} to %{remote_ip}:%{remote_port}\n" http://127.0.0.1:8765/
          "utc now: " + [DateTime]::UtcNow.ToString("o")
          $job.WaitForExit()
          "exit: " + $job.ExitCode
          Get-Content read.txt
          Get-Content read.err
          Stop-Process -Id $srv.Id -Force
          "sessions of ours after the end:"
          logman query -ets | Select-String "raqib"
      - name: a reader killed, and the next start finds its leftover
        shell: pwsh
        run: |
          $job = Start-Process python -ArgumentList "tools/rig/etw_read.py","60" -PassThru -NoNewWindow -RedirectStandardOutput k.txt -RedirectStandardError k.err
          Start-Sleep -Seconds 5
          Stop-Process -Id $job.Id -Force
          Start-Sleep -Seconds 2
          "after the kill:"
          logman query -ets | Select-String "raqib"
          python tools/rig/etw_read.py 2
          "exit: $LASTEXITCODE"
          "after the next run:"
          logman query -ets | Select-String "raqib"
  linuxevents:
    name: what Linux tells between two samples (M14, the field test of 2026-11-20; ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]   # 22.04's own Python is 3.10: raqib does not install there without another
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the kernel's process events and socket ends, as root, and under the unit's limits
        run: bash tools/rig/linux_events_probe.sh
      - name: after an overflow, and what threads send (the review of M14.1a)
        if: always()
        run: python3 tools/rig/linux_events_probe2.py
      - name: seq, the order at an overflow, a thread's exec under load (the second review of M14.1a)
        if: always()
        run: python3 tools/rig/linux_events_probe3.py
      - name: does an answer take a number of the count (the third review of M14.1a, H1)
        if: always()
        run: python3 tools/rig/linux_events_probe4.py
      - name: the reader beside a busy interpreter, and in a process of its own (BR-9, before M14.1b is ruled)
        if: always()
        run: python3 tools/rig/reader_load_probe.py
      - name: the watch with its helper (M14.1b), 100 short children and three curls beside it
        if: always()
        run: |
          python -m pip install --disable-pip-version-check -q . || pip install --break-system-packages -q .
          raqib watch --host --rounds 6 --every 3 --no-open > "$RUNNER_TEMP/w141b.out" 2> "$RUNNER_TEMP/w141b.err" &
          w=$!
          sleep 5
          for i in $(seq 100); do true & wait $!; /bin/true; done
          for i in 1 2 3; do curl -s -o /dev/null --max-time 5 https://example.com/ || true; done
          wait $w; echo "the watch's exit: $?"
          echo "=== the section"; grep -A6 "^PROCESS EVENTS" "$RUNNER_TEMP/w141b.out" || echo "no section"
          echo "=== the words on what lives between two samples"; grep -i "between two\|process events" "$RUNNER_TEMP/w141b.out" | cut -c1-300 | head -12
          echo "=== blind spots and holes"; grep -A6 "^BLIND SPOTS\|^HOLES" "$RUNNER_TEMP/w141b.out" | cut -c1-300 | head -24
          echo "=== trees"; grep -A12 "^TREES SEEN" "$RUNNER_TEMP/w141b.out" | cut -c1-200
          echo "=== helpers left"; pgrep -af "raqib.procevents" || echo none
          echo "=== stderr"; tail -5 "$RUNNER_TEMP/w141b.err"
      - name: the watch whose helper is stopped under it stays on time (M14.1b REDO, BW-1)
        if: always()
        run: |
          python -m pip install --disable-pip-version-check -q . || pip install --break-system-packages -q .
          start=$(date +%s)
          raqib watch --host --rounds 10 --every 3 --no-open --no-page > "$RUNNER_TEMP/w-stop.out" 2> "$RUNNER_TEMP/w-stop.err" &
          w=$!
          sleep 8
          echo "=== helpers before"; pgrep -af "procevents" || echo none
          pkill -STOP -f "procevents.main" && echo "the helper is stopped (SIGSTOP)" || echo "no helper found to stop"
          code=0; wait $w || code=$?; echo "the watch's exit: $code; it took $(( $(date +%s) - start )) s (ten rounds of 3 s)"
          echo "=== findings"; grep "FINDING\|^ALARMS\|^RESULT\|Traceback\|Error" "$RUNNER_TEMP/w-stop.out" "$RUNNER_TEMP/w-stop.err" | cut -c1-260 | head -12
          echo "=== the section"; sed -n '/^PROCESS EVENTS/,/^[A-Z][A-Z ]*[:(]/p' "$RUNNER_TEMP/w-stop.out" | cut -c1-300 | head -24
          echo "=== rounds"; grep -c "^\[.*round [0-9]*:" "$RUNNER_TEMP/w-stop.out"; grep "late\|INCOMPLETE\|RESULT" "$RUNNER_TEMP/w-stop.out" | cut -c1-260 | head -12
          echo "=== the words on what lives between two samples"; grep -i "between two" "$RUNNER_TEMP/w-stop.out" | cut -c1-300 | tail -3
          echo "=== helpers left"; pgrep -af "procevents" || echo none
          pkill -KILL -f "procevents.main" || true
      - name: the reader itself (M14.1a), as a plain user, five times
        if: always()
        run: |
          for i in 1 2 3 4 5; do
            python3 tools/rig/procevents_run.py --out "$RUNNER_TEMP/pe-$i.json" || true
            python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          acts=d.get('acts') or []
          print('run', sys.argv[2], {k: d.get(k) for k in ('platform','refused','not_run','error') if d.get(k)}, 'acts', len(acts), 'counts', json.dumps(d.get('counts'), sort_keys=True)[:600])
          for a in acts:
              print('   ', json.dumps(a, sort_keys=True)[:260])
          " "$RUNNER_TEMP/pe-$i.json" $i
          done

  rules:
    name: a person's rules added, switched off and removed, against a live watch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: install Sysmon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          Start-Sleep 3
      - name: add, watch, switch off, watch, remove, watch
        run: python tools/rig/rules_probe.py

  pubconf:
    name: the three acts under a public Sysmon configuration (${{ matrix.conf }}; M15.2, measured before ruling)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - conf: swift
            url: https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib
        run: python -m pip install --disable-pip-version-check .
      - name: install Sysmon with the public configuration (fetched here, never kept in the tree)
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          Invoke-WebRequest "${{ matrix.url }}" -OutFile $env:RUNNER_TEMP\pub.xml
          "the configuration: $((Get-Item $env:RUNNER_TEMP\pub.xml).Length) bytes"
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i $env:RUNNER_TEMP\pub.xml
          Start-Sleep 3
      - name: the watch while the stand-in does the three acts
        shell: pwsh
        run: |
          $l = Start-Process python -ArgumentList "tools\rig\effects.py","--listen" -RedirectStandardOutput "$env:RUNNER_TEMP\listen.out" -RedirectStandardError "$env:RUNNER_TEMP\listen.err" -PassThru -NoNewWindow
          $out = "$env:RUNNER_TEMP\watch.out"; $err = "$env:RUNNER_TEMP\watch.err"
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","32","--every","5","--no-open" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep 7
          python tools\rig\effects.py | Tee-Object -FilePath $env:RUNNER_TEMP\effects.out
          $w.WaitForExit(260000) | Out-Null
          "=== the watch's exit: $($w.ExitCode)"
          "=== the watch's report"; Get-Content $out
          "=== the watch's stderr"; Get-Content $err | Select-Object -Last 40
          Stop-Process -Id $l.Id -Force -ErrorAction SilentlyContinue
      - name: what the stand-in's tree left in its source, and the findings
        if: always()
        shell: pwsh
        run: python tools\rig\effects_read.py $env:RUNNER_TEMP\effects.out
      - name: what the configuration logged
        if: always()
        shell: pwsh
        run: |
          cmd /c "wevtutil qe Microsoft-Windows-Sysmon/Operational /f:xml > %RUNNER_TEMP%\channel.xml"
          python tools\rig\pubconf_read.py $env:RUNNER_TEMP\channel.xml

  said:
    name: what the watch says of a Sysmon that logs less (${{ matrix.conf }}; M15.2b, AE-2 and AE-3)
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        conf: [sysmon-quiet.xml, sysmon-reg.xml]
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib and Sysmon with this configuration
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check .
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\${{ matrix.conf }}
          Start-Sleep 3
      - name: a watch of six rounds while a file is made and a value is set (each undone)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\watch.out"; $err = "$env:RUNNER_TEMP\watch.err"
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","6","--every","5","--no-open","--no-page" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep 6
          Set-Content -LiteralPath "$env:TEMP\raqib-said.txt" -Value "x"; Remove-Item "$env:TEMP\raqib-said.txt"
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v RaqibSaid /t REG_SZ /d "cmd /c rem" /f | Out-Null
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v RaqibSaid /f | Out-Null
          $w.WaitForExit(120000) | Out-Null
          "=== the watch's exit: $($w.ExitCode)"
          $t = Get-Content $out
          "=== CHANNEL"; ($t | Select-String -Pattern "^CHANNEL").Line
          "=== what it says of event 11 and of the registry"; ($t | Select-String -Pattern "event 11|event 13|registry").Line | Select-Object -First 12
          "=== BLIND SPOTS"; $i = ($t | Select-String -Pattern "^BLIND SPOTS" | Select-Object -First 1).LineNumber; if ($i) { $t[($i-1)..([Math]::Min($i+5,$t.Count-1))] }
          "=== rounds and result"; ($t | Select-String -Pattern "^ROUNDS:|^RESULT|^HOLES").Line
          "=== events in the channel by id"; Get-WinEvent -LogName Microsoft-Windows-Sysmon/Operational -MaxEvents 5000 -ErrorAction SilentlyContinue | Group-Object Id | Sort-Object Name | ForEach-Object { "$($_.Name): $($_.Count)" }

  autostart:
    name: what Raqib could read of the autostart places by itself (M15.3, measured before ADR-0014 S3 is ruled)
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      QUIET_SECONDS: "90"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: how M15.3b's `sure` labels this machine's own texts, and how many hives are loaded (the third review's S3 and Q3)
        shell: pwsh
        run: |
          git fetch -q --depth 1 origin claude/M15.3b
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\m153b" | Out-Null
          git show FETCH_HEAD:raqib/autostart.py | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\m153b\autostart.py"
          $env:PYTHONPATH = (Get-Location).Path
          python tools\rig\sure_probe.py "$env:RUNNER_TEMP\m153b"
      - name: ten quiet minutes under main's Watcher - what Windows itself changes in the autostart places (M15.3c, measured before it is ruled)
        shell: pwsh
        run: |
          git fetch -q --depth 1 origin main
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\main-as" | Out-Null
          git show FETCH_HEAD:raqib/autostart.py | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\main-as\autostart.py"
          $env:PYTHONPATH = (Get-Location).Path
          $out = "$env:RUNNER_TEMP\quiet.out"
          python "$env:RUNNER_TEMP\main-as\autostart.py" --rounds 60 --every 2 > $out 2> "$env:RUNNER_TEMP\quiet.err"
          "=== lines: $((Get-Content $out).Count); the first two"; Get-Content $out | Select-Object -First 2
          "=== every line that is not a plain read"; Get-Content $out | Select-String -Pattern "CHANGE|BASE|REFUSED|not read|in part|failed" | Select-Object -First 60
          "=== the last line"; Get-Content $out | Select-Object -Last 1
          "=== stderr"; Get-Content "$env:RUNNER_TEMP\quiet.err" -ErrorAction SilentlyContinue | Select-Object -First 5
      - name: which values of a service's key Windows itself changes, seven minutes (M15.3c)
        shell: pwsh
        run: python tools\rig\service_values_probe.py 420
      - name: the places read, a quiet minute and a half, four acts each undone
        shell: pwsh
        run: python tools\rig\autostart_probe.py
      - name: the same reads under a token of fewer rights
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $probe = (Resolve-Path tools\rig\autostart_probe.py).Path
          $out = "$env:PUBLIC\raqib-reads.json"; $who = "$env:PUBLIC\raqib-who.txt"
          runas /trustlevel:0x20000 "cmd /c whoami /groups /fo csv > $who 2>&1"
          runas /trustlevel:0x20000 "`"$py`" `"$probe`" --reads `"$out`""
          Start-Sleep 20
          "=== the token's administrators group"; if (Test-Path $who) { (Get-Content $who | Select-String -Pattern "S-1-5-32-544|S-1-16-").Line } else { "no answer was written" }
          "=== the reads"; if (Test-Path $out) { Get-Content $out } else { "no reads were written (the token could not run it, or could not write there)" }
          python tools\rig\autostart_probe.py --cleanup
      - name: the module's own reads beside the stand-in, each change said (the rig counted 11 where the stand-in made 6)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q .
          $out = "$env:RUNNER_TEMP\auto.out"
          $r = Start-Process python -ArgumentList "-m","raqib.autostart","--rounds","70","--every","1" -RedirectStandardOutput $out -RedirectStandardError "$env:RUNNER_TEMP\auto.err" -PassThru -NoNewWindow
          Start-Sleep 5
          python tools\rig\workload.py > "$env:RUNNER_TEMP\wl.out" 2>&1
          "=== the stand-in"; Get-Content "$env:RUNNER_TEMP\wl.out" | Select-String -Pattern "autostart|Startup|service|undo|done" | Select-Object -First 20
          $r.WaitForExit(120000) | Out-Null
          "=== what the reads said"; Get-Content $out | Select-Object -First 60
          "=== stderr"; Get-Content "$env:RUNNER_TEMP\auto.err" -ErrorAction SilentlyContinue | Select-Object -First 5
      - name: a Startup file held open without sharing across a read, then let go (ADR-0014 AH-3)
        shell: pwsh
        run: python tools\rig\held_probe.py

  siem:
    name: what a SOC's search engine does with the events (${{ matrix.engine }}; M16, measured before it is ruled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [elasticsearch, opensearch]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the engine, on this machine's own port and nowhere else
        run: |
          if [ "${{ matrix.engine }}" = elasticsearch ]; then
            docker run -d --name engine -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e ES_JAVA_OPTS="-Xms1g -Xmx1g" docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          else
            docker run -d --name engine -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true -e OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g" opensearchproject/opensearch:2.17.1
          fi
      - name: a real watch's events file (four rounds of the host watch, a curl beside it)
        run: |
          python -m pip install --disable-pip-version-check -q .
          raqib watch --host --rounds 4 --every 5 --no-open --no-page > "$RUNNER_TEMP/watch.out" 2>&1 &
          w=$!
          for i in 1 2 3; do curl -s -o /dev/null https://api.github.com/zen || true; done
          code=0; wait $w || code=$?
          echo "the watch's exit: $code"; ls -la ~/.raqib/host/ | sed -n 1,12p
      - name: the events as they are, through a pipeline, and the searches
        run: |
          python tools/rig/siem_probe.py docs/specs/EVENT.md ~/.raqib/host/events.jsonl || { echo "=== the engine's last words"; docker logs --tail 40 engine; exit 1; }
      - name: the search for silence as the review of M16.1 asks it ruled, on the content of claude/M16.1
        run: |
          git fetch -q --depth 1 origin claude/M16.1 && git checkout -q FETCH_HEAD -- siem || echo "the content could not be fetched"
          if [ "${{ matrix.engine }}" = elasticsearch ]; then c=siem/elastic; else c=siem/opensearch; fi
          python tools/rig/siem_probe3.py docs/specs/EVENT.md $c || { echo "=== the engine's last words"; docker logs --tail 30 engine; }
      - name: what the second review of M16.1 suspects and nobody fed (long keys, numbers beyond a double, a shipper's fields as texts, the order of runs)
        run: |
          if [ "${{ matrix.engine }}" = elasticsearch ]; then c=siem/elastic; else c=siem/opensearch; fi
          cd tools/rig && python siem_probe4.py ../../docs/specs/EVENT.md ../../$c || { echo "=== the engine's last words"; docker logs --tail 30 engine; }
      - name: the drafts of Sigma rules, converted and run
        run: |
          python -m pip install --disable-pip-version-check -q sigma-cli pysigma-backend-elasticsearch pysigma-backend-opensearch pysigma-backend-splunk || echo "sigma's tools could not be installed"
          sigma version || true
          d=tools/rig/sigma-draft
          echo "=== to the engine's query string, through the pipeline of names"
          if [ "${{ matrix.engine }}" = elasticsearch ]; then t=lucene; else t=opensearch_lucene; fi
          sigma convert -t $t -p $d/pipeline-ecs.yml $d/raqib_alarm.yml $d/raqib_hole.yml $d/raqib_persist.yml > "$RUNNER_TEMP/q.txt" || { echo "the conversion failed"; sigma list targets || true; }
          cat "$RUNNER_TEMP/q.txt" || true
          python tools/rig/sigma_probe.py "$RUNNER_TEMP/q.txt" || true
          echo "=== to Splunk's search language, with no pipeline (not run: no Splunk here)"
          sigma convert -t splunk --without-pipeline $d/raqib_alarm.yml $d/raqib_hole.yml $d/raqib_persist.yml || echo "the conversion failed"

  effects:
    name: what an agent's three acts leave (the field test of 2026-11-20; M15; raqib of ${{ matrix.build }}, try ${{ matrix.try }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [this]
        try: [1, 2]
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install raqib (this branch's, or main's to compare)
        shell: pwsh
        run: |
          if ("${{ matrix.build }}" -eq "main") {
            git fetch --depth 1 origin main
            git worktree add $env:RUNNER_TEMP\main FETCH_HEAD
            python -m pip install --disable-pip-version-check $env:RUNNER_TEMP\main
          } else {
            python -m pip install --disable-pip-version-check .
          }
      - name: install Sysmon (the rig's kinds, and the registry's autostart keys)
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-reg.xml
          Start-Sleep 3
      - name: the watch while the stand-in does the three acts
        shell: pwsh
        run: |
          $l = Start-Process python -ArgumentList "tools\rig\effects.py","--listen" -RedirectStandardOutput "$env:RUNNER_TEMP\listen.out" -RedirectStandardError "$env:RUNNER_TEMP\listen.err" -PassThru -NoNewWindow
          $out = "$env:RUNNER_TEMP\watch.out"; $err = "$env:RUNNER_TEMP\watch.err"
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","32","--every","5","--no-open" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          Start-Sleep 7
          python tools\rig\effects.py | Tee-Object -FilePath $env:RUNNER_TEMP\effects.out
          $w.WaitForExit(260000) | Out-Null
          "=== the watch's exit: $($w.ExitCode)"
          "=== the watch's report"; Get-Content $out
          "=== the watch's stderr"; Get-Content $err
          "=== the listener"; Get-Content "$env:RUNNER_TEMP\listen.out"; Get-Content "$env:RUNNER_TEMP\listen.err"
          Stop-Process -Id $l.Id -Force -ErrorAction SilentlyContinue
      - name: what the stand-in's tree left in its source, and the findings
        if: always()
        shell: pwsh
        run: python tools\rig\effects_read.py $env:RUNNER_TEMP\effects.out
      - name: Sysmon's own word on the acts (registry 12 to 14, files, port 22, the programs)
        if: always()
        shell: pwsh
        run: |
          $log = 'Microsoft-Windows-Sysmon/Operational'
          "=== registry events (12, 13, 14), the newest 30"
          Get-WinEvent -FilterHashtable @{LogName=$log; Id=12,13,14} -MaxEvents 30 -ErrorAction SilentlyContinue | ForEach-Object { "--- event $($_.Id)"; $_.Message }
          "=== one event 13 as XML"
          wevtutil qe $log "/q:*[System[(EventID=13)]]" /f:xml /c:1 /rd:true
          "=== file events (11) under a Startup folder, System32\Tasks, or of the test's file"
          Get-WinEvent -FilterHashtable @{LogName=$log; Id=11} -MaxEvents 4000 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Startup\\|System32\\Tasks\\Raqib|raqib-effect' } | ForEach-Object { "--- event 11"; $_.Message }
          "=== network events (3) to port 22"
          Get-WinEvent -FilterHashtable @{LogName=$log; Id=3} -MaxEvents 4000 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'DestinationPort: 22\s' } | ForEach-Object { "--- event 3"; $_.Message }
          "=== process events (1) of reg, schtasks, ssh, and powershell under cmd"
          Get-WinEvent -FilterHashtable @{LogName=$log; Id=1} -MaxEvents 4000 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Image: .*\\(reg|schtasks|ssh)\.exe' -or ($_.Message -match 'Image: .*\\powershell\.exe' -and $_.Message -match 'ParentImage: .*\\cmd\.exe') } | ForEach-Object { "--- event 1"; ($_.Message -split "`n" | Where-Object { $_ -match '^(UtcTime|ProcessId|Image|CommandLine|CurrentDirectory|User|IntegrityLevel|ParentProcessId|ParentImage|ParentCommandLine):' }) }
      - name: how often Sysmon wrote an empty ProcessGuid
        if: always()
        shell: pwsh
        run: |
          cmd /c "wevtutil qe Microsoft-Windows-Sysmon/Operational /f:xml > %RUNNER_TEMP%\channel.xml"
          python tools\rig\pubconf_read.py $env:RUNNER_TEMP\channel.xml

  windows:
    name: agents (windows, Sysmon)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install raqib, Sysmon and the agents
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check .
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          npm install -g "@qwen-code/qwen-code"
          npm install -g opencode-ai
          qwen --version; opencode --version
      - name: the scripted model
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } | Select-Object -First 1).IPAddress
          "RIG_URL=http://${ip}:8790/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RIG_MODEL=$env:GITHUB_WORKSPACE\tools\rig\model.py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: a talker beside the watch (ADR-0007 BH-3, what stands near the watch is not the watch's)
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-beside.log" -NoNewWindow
          Start-Sleep 3
          python "$env:GITHUB_WORKSPACE\tools\rig\beside.py" "$env:RIG_URL/models" "$env:RUNNER_TEMP\beside.txt" "$env:RUNNER_TEMP\watch-beside.out"
          "=== beside"; (Get-Content "$env:RUNNER_TEMP\watch-beside.out" | Select-String -Pattern "^run: |^TREES SEEN|^RESULT|FINDING ").Line
          python "$env:GITHUB_WORKSPACE\tools\rig\beside_read.py" "$env:RUNNER_TEMP\beside.txt"
      - name: qwen under the watch
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-qwen | Out-Null; Set-Location $env:RUNNER_TEMP\w-qwen
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-qwen.log" -NoNewWindow
          Start-Sleep 3
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-qwen.out -RedirectStandardError ..\watch-qwen.err -PassThru -NoNewWindow
          Start-Sleep 7
          $env:OPENAI_API_KEY = "rig"; $env:OPENAI_BASE_URL = $env:RIG_URL; $env:OPENAI_MODEL = "rig-model"
          # BC-7: the agent is started by an unknown program that then talks by itself (two trees, one under the other)
          $env:RIG_CMD = 'qwen -p "Do the task." --yolo > ..\agent-qwen.out 2>&1'
          $a = Start-Process python -ArgumentList "$env:GITHUB_WORKSPACE\tools\rig\launcher.py","10","$env:RIG_URL/models" -RedirectStandardOutput ..\launcher-qwen.out -PassThru -NoNewWindow
          if (-not $a.WaitForExit(130000)) { taskkill /T /F /PID $a.Id | Out-Null; "launcher: stopped at its time" }
          Get-Content ..\launcher-qwen.out
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-qwen.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-qwen.log
          "=== report"; $t = Get-Content ..\watch-qwen.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
          "=== rhythm"; python "$env:GITHUB_WORKSPACE\tools\rig\rhythm_read.py" node qwen opencode bun curl python
          "=== marks"; python "$env:GITHUB_WORKSPACE\tools\rig\marks_read.py"
          "=== reader"; python "$env:GITHUB_WORKSPACE\tools\rig\inv_read.py"
      - name: qwen under the watch, its connection kept (ADR-0007 BO, the bytes by the tracing)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-kept | Out-Null; Set-Location $env:RUNNER_TEMP\w-kept
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          $env:RIG_CLOSE = ""    # unset: the model keeps the connection: one connection, many turns
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-kept.log" -NoNewWindow
          Start-Sleep 3
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-kept.out -RedirectStandardError ..\watch-kept.err -PassThru -NoNewWindow
          Start-Sleep 7
          $env:OPENAI_API_KEY = "rig"; $env:OPENAI_BASE_URL = $env:RIG_URL; $env:OPENAI_MODEL = "rig-model"
          # BC-7: the agent is started by an unknown program that then talks by itself (two trees, one under the other)
          $env:RIG_CMD = 'qwen -p "Do the task." --yolo > ..\agent-kept.out 2>&1'
          $a = Start-Process python -ArgumentList "$env:GITHUB_WORKSPACE\tools\rig\launcher.py","10","$env:RIG_URL/models" -RedirectStandardOutput ..\launcher-kept.out -PassThru -NoNewWindow
          if (-not $a.WaitForExit(130000)) { taskkill /T /F /PID $a.Id | Out-Null; "launcher: stopped at its time" }
          Get-Content ..\launcher-kept.out
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-kept.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-kept.log
          "=== report"; $t = Get-Content ..\watch-kept.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
          "=== sessions of ours after the watch"; logman query -ets | Select-String "raqib"
          "=== bytes"; ($t | Select-String -Pattern "bytes|tracing|blind").Line | Select-Object -First 40
          "=== connections"; python "$env:GITHUB_WORKSPACE\tools\rig\conn_read.py"
          "=== rhythm"; python "$env:GITHUB_WORKSPACE\tools\rig\rhythm_read.py" node qwen opencode bun curl python
          "=== marks"; python "$env:GITHUB_WORKSPACE\tools\rig\marks_read.py"
          "=== reader"; python "$env:GITHUB_WORKSPACE\tools\rig\inv_read.py"
      - name: opencode under the watch
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-opencode | Out-Null; Set-Location $env:RUNNER_TEMP\w-opencode
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-opencode.log" -NoNewWindow
          Start-Sleep 3
          $cfg = @{ '$schema' = "https://opencode.ai/config.json"; provider = @{ rig = @{ npm = "@ai-sdk/openai-compatible"; name = "Rig"; options = @{ baseURL = $env:RIG_URL; apiKey = "rig" }; models = @{ "rig-model" = @{ name = "Rig" } } } }; model = "rig/rig-model"; permission = @{ bash = "allow"; edit = "allow" } }
          $cfg | ConvertTo-Json -Depth 8 | Out-File opencode.json -Encoding utf8
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-opencode.out -RedirectStandardError ..\watch-opencode.err -PassThru -NoNewWindow
          Start-Sleep 7
          $a = Start-Process cmd -ArgumentList "/c","opencode run `"Do the task.`" > ..\agent-opencode.out 2>&1" -PassThru -NoNewWindow
          if (-not $a.WaitForExit(110000)) { taskkill /T /F /PID $a.Id | Out-Null; "opencode: stopped at its time" }
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-opencode.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-opencode.log
          "=== report"; $t = Get-Content ..\watch-opencode.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
          "=== rhythm"; python "$env:GITHUB_WORKSPACE\tools\rig\rhythm_read.py" node qwen opencode bun curl python
          "=== marks"; python "$env:GITHUB_WORKSPACE\tools\rig\marks_read.py"
          "=== reader"; python "$env:GITHUB_WORKSPACE\tools\rig\inv_read.py"

