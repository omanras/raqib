# The real-agents probe (never merged; the commander's word of 2026-11-13: run the agents on GitHub's machines,
# without asking each time). A real agent CLI is installed on the runner and pointed at tools/rig/model.py, a
# scripted model on the runner itself that asks for three fixed commands (curl, curl, whoami). No key, no secret,
# read-only permissions; the machine is thrown away after the job.
name: agents-probe
on:
  push:
    branches: [claude/rig-probe]
permissions:
  contents: read
jobs:
  linux:
    name: agents (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install raqib and the agents
        run: |
          python -m pip install --disable-pip-version-check .
          npm install -g @qwen-code/qwen-code || echo "qwen: install failed"
          npm install -g opencode-ai || echo "opencode: install failed"
          python -m pip install --disable-pip-version-check kimi-cli || echo "kimi: install failed"
          qwen --version || true; opencode --version || true; kimi --version || true
      - name: the scripted model
        run: |
          ip=$(hostname -I | awk '{print $1}')
          echo "RIG_URL=http://$ip:8790/v1" >> "$GITHUB_ENV"
          nohup python tools/rig/model.py --port 8790 --log "$RUNNER_TEMP/model.log" > /dev/null 2>&1 &
          sleep 2; curl -s "http://$ip:8790/v1/models"; echo
      - name: qwen under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-qwen" && cd "$RUNNER_TEMP/w-qwen"
          raqib watch --host --rounds 22 --every 5 --no-open > ../watch-qwen.out 2> ../watch-qwen.err &
          w=$!; sleep 7
          OPENAI_API_KEY=rig OPENAI_BASE_URL="$RIG_URL" OPENAI_MODEL=rig-model timeout 80 qwen -p "Do the task." --yolo > ../agent-qwen.out 2>&1 || echo "qwen rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-qwen.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"; : > "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-qwen.out
      - name: kimi under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-kimi" && cd "$RUNNER_TEMP/w-kimi"
          raqib watch --host --rounds 22 --every 5 --no-open > ../watch-kimi.out 2> ../watch-kimi.err &
          w=$!; sleep 7
          KIMI_API_KEY=rig KIMI_BASE_URL="$RIG_URL" KIMI_MODEL_NAME=rig-model timeout 80 kimi --print -p "Do the task." --yolo > ../agent-kimi.out 2>&1 || echo "kimi rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-kimi.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"; : > "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-kimi.out
      - name: opencode under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-opencode" && cd "$RUNNER_TEMP/w-opencode"
          cat > opencode.json <<JSON
          {"\$schema": "https://opencode.ai/config.json",
           "provider": {"rig": {"npm": "@ai-sdk/openai-compatible", "name": "Rig",
                                "options": {"baseURL": "$RIG_URL", "apiKey": "rig"},
                                "models": {"rig-model": {"name": "Rig"}}}},
           "model": "rig/rig-model", "permission": {"bash": "allow", "edit": "allow"}}
          JSON
          raqib watch --host --rounds 22 --every 5 --no-open > ../watch-opencode.out 2> ../watch-opencode.err &
          w=$!; sleep 7
          timeout 80 opencode run "Do the task." > ../agent-opencode.out 2>&1 || echo "opencode rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-opencode.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-opencode.out

  windows:
    name: agents (windows, Sysmon)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install raqib, Sysmon and the agents
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check .
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          npm install -g "@qwen-code/qwen-code"
          npm install -g opencode-ai
          qwen --version; opencode --version
      - name: the scripted model
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } | Select-Object -First 1).IPAddress
          "RIG_URL=http://${ip}:8790/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RIG_MODEL=$env:GITHUB_WORKSPACE\tools\rig\model.py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: qwen under the watch
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-qwen | Out-Null; Set-Location $env:RUNNER_TEMP\w-qwen
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-qwen.log" -NoNewWindow
          Start-Sleep 3
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-qwen.out -RedirectStandardError ..\watch-qwen.err -PassThru -NoNewWindow
          Start-Sleep 7
          $env:OPENAI_API_KEY = "rig"; $env:OPENAI_BASE_URL = $env:RIG_URL; $env:OPENAI_MODEL = "rig-model"
          $a = Start-Process cmd -ArgumentList "/c","qwen -p `"Do the task.`" --yolo > ..\agent-qwen.out 2>&1" -PassThru -NoNewWindow
          if (-not $a.WaitForExit(110000)) { taskkill /T /F /PID $a.Id | Out-Null; "qwen: stopped at its time" }
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-qwen.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-qwen.log
          "=== report"; $t = Get-Content ..\watch-qwen.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
      - name: opencode under the watch
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-opencode | Out-Null; Set-Location $env:RUNNER_TEMP\w-opencode
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-opencode.log" -NoNewWindow
          Start-Sleep 3
          $cfg = @{ '$schema' = "https://opencode.ai/config.json"; provider = @{ rig = @{ npm = "@ai-sdk/openai-compatible"; name = "Rig"; options = @{ baseURL = $env:RIG_URL; apiKey = "rig" }; models = @{ "rig-model" = @{ name = "Rig" } } } }; model = "rig/rig-model"; permission = @{ bash = "allow"; edit = "allow" } }
          $cfg | ConvertTo-Json -Depth 8 | Out-File opencode.json -Encoding utf8
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-opencode.out -RedirectStandardError ..\watch-opencode.err -PassThru -NoNewWindow
          Start-Sleep 7
          $a = Start-Process cmd -ArgumentList "/c","opencode run `"Do the task.`" > ..\agent-opencode.out 2>&1" -PassThru -NoNewWindow
          if (-not $a.WaitForExit(110000)) { taskkill /T /F /PID $a.Id | Out-Null; "opencode: stopped at its time" }
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-opencode.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-opencode.log
          "=== report"; $t = Get-Content ..\watch-opencode.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]

