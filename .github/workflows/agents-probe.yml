# The real-agents probe (never merged; the commander's word of 2026-11-13: run the agents on GitHub's machines,
# without asking each time). A real agent CLI is installed on the runner and pointed at tools/rig/model.py, a
# scripted model on the runner itself that asks for three fixed commands (curl, curl, whoami). No key, no secret,
# read-only permissions; the machine is thrown away after the job.
name: agents-probe
on:
  push:
    branches: [claude/rig-probe]
permissions:
  contents: read
env:
  RIG_CLOSE: "1"   # the model ends the connection with each answer: one connection per turn
jobs:
  linux:
    name: agents (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install raqib and the agents
        run: |
          python -m pip install --disable-pip-version-check .
          npm install -g @qwen-code/qwen-code || echo "qwen: install failed"
          npm install -g opencode-ai || echo "opencode: install failed"
          python -m pip install --disable-pip-version-check kimi-cli || echo "kimi: install failed"
          qwen --version || true; opencode --version || true; kimi --version || true
      - name: the scripted model
        run: |
          ip=$(hostname -I | awk '{print $1}')
          echo "RIG_URL=http://$ip:8790/v1" >> "$GITHUB_ENV"
          nohup python tools/rig/model.py --port 8790 --log "$RUNNER_TEMP/model.log" > /dev/null 2>&1 &
          sleep 2; curl -s "http://$ip:8790/v1/models"; echo
      - name: qwen under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-qwen" && cd "$RUNNER_TEMP/w-qwen"
          raqib watch --host --rounds 30 --every 5 --no-open > ../watch-qwen.out 2> ../watch-qwen.err &
          w=$!; sleep 7
          OPENAI_API_KEY=rig OPENAI_BASE_URL="$RIG_URL" OPENAI_MODEL=rig-model timeout 130 qwen -p "Do the task." --yolo > ../agent-qwen.out 2>&1 || echo "qwen rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-qwen.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"; : > "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-qwen.out
          echo "=== rhythm"; python "$GITHUB_WORKSPACE/tools/rig/rhythm_read.py" node qwen opencode bun curl || true
      - name: kimi under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-kimi" && cd "$RUNNER_TEMP/w-kimi"
          raqib watch --host --rounds 30 --every 5 --no-open > ../watch-kimi.out 2> ../watch-kimi.err &
          w=$!; sleep 7
          KIMI_API_KEY=rig KIMI_BASE_URL="$RIG_URL" KIMI_MODEL_NAME=rig-model timeout 80 kimi --print -p "Do the task." --yolo > ../agent-kimi.out 2>&1 || echo "kimi rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-kimi.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"; : > "$RUNNER_TEMP/model.log"
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-kimi.out
      - name: opencode under the watch
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w-opencode" && cd "$RUNNER_TEMP/w-opencode"
          cat > opencode.json <<JSON
          {"\$schema": "https://opencode.ai/config.json",
           "provider": {"rig": {"npm": "@ai-sdk/openai-compatible", "name": "Rig",
                                "options": {"baseURL": "$RIG_URL", "apiKey": "rig"},
                                "models": {"rig-model": {"name": "Rig"}}}},
           "model": "rig/rig-model", "permission": {"bash": "allow", "edit": "allow"}}
          JSON
          raqib watch --host --rounds 30 --every 5 --no-open > ../watch-opencode.out 2> ../watch-opencode.err &
          w=$!; sleep 7
          timeout 130 opencode run "Do the task." > ../agent-opencode.out 2>&1 || echo "opencode rc=$?"
          wait $w || true
          echo "=== agent"; tail -30 ../agent-opencode.out; echo "=== model log"; cat "$RUNNER_TEMP/model.log"
          echo "=== rhythm"; python "$GITHUB_WORKSPACE/tools/rig/rhythm_read.py" node qwen opencode bun curl || true
          echo "=== report"; sed -n '/^Raqib watch --host/,$p' ../watch-opencode.out

  etw:
    name: the tracing reader in the field (M7.21a, ADR-0007 BL)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the structures' sizes as this system's ctypes lays them
        shell: pwsh
        run: |
          python -c "import ctypes; from raqib import etwnet as e; print({n: ctypes.sizeof(getattr(e, n)) for n in dir(e) if isinstance(getattr(e, n), type) and issubclass(getattr(e, n), ctypes.Structure) and getattr(e, n) is not ctypes.Structure})"
      - name: the reader over real traffic (remote and loopback)
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1" -PassThru -WindowStyle Hidden
          $job = Start-Process python -ArgumentList "tools/rig/etw_read.py","14" -PassThru -NoNewWindow -RedirectStandardOutput read.txt -RedirectStandardError read.err
          Start-Sleep -Seconds 4
          logman query -ets | Select-String "raqib"
          curl.exe -s -o NUL -w "remote https: sent %{size_request} got %{size_download} from %{local_ip}:%{local_port} to %{remote_ip}:%{remote_port}\n" https://example.com/
          curl.exe -s -o NUL -w "remote http: sent %{size_request} got %{size_download} from %{local_ip}:%{local_port} to %{remote_ip}:%{remote_port}\n" http://example.com/
          curl.exe -s -o NUL -w "loopback: sent %{size_request} got %{size_download} from %{local_ip}:%{local_port} to %{remote_ip}:%{remote_port}\n" http://127.0.0.1:8765/
          "utc now: " + [DateTime]::UtcNow.ToString("o")
          $job.WaitForExit()
          "exit: " + $job.ExitCode
          Get-Content read.txt
          Get-Content read.err
          Stop-Process -Id $srv.Id -Force
          "sessions of ours after the end:"
          logman query -ets | Select-String "raqib"
      - name: a reader killed, and the next start finds its leftover
        shell: pwsh
        run: |
          $job = Start-Process python -ArgumentList "tools/rig/etw_read.py","60" -PassThru -NoNewWindow -RedirectStandardOutput k.txt -RedirectStandardError k.err
          Start-Sleep -Seconds 5
          Stop-Process -Id $job.Id -Force
          Start-Sleep -Seconds 2
          "after the kill:"
          logman query -ets | Select-String "raqib"
          python tools/rig/etw_read.py 2
          "exit: $LASTEXITCODE"
          "after the next run:"
          logman query -ets | Select-String "raqib"
  windows:
    name: agents (windows, Sysmon)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install raqib, Sysmon and the agents
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check .
          Invoke-WebRequest https://download.sysinternals.com/files/Sysmon.zip -OutFile $env:RUNNER_TEMP\Sysmon.zip
          Expand-Archive $env:RUNNER_TEMP\Sysmon.zip $env:RUNNER_TEMP\Sysmon -Force
          & $env:RUNNER_TEMP\Sysmon\Sysmon64.exe -accepteula -i tools\rig\sysmon-all.xml
          npm install -g "@qwen-code/qwen-code"
          npm install -g opencode-ai
          qwen --version; opencode --version
      - name: the scripted model
        shell: pwsh
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } | Select-Object -First 1).IPAddress
          "RIG_URL=http://${ip}:8790/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RIG_MODEL=$env:GITHUB_WORKSPACE\tools\rig\model.py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: a talker beside the watch (ADR-0007 BH-3, what stands near the watch is not the watch's)
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-beside.log" -NoNewWindow
          Start-Sleep 3
          python "$env:GITHUB_WORKSPACE\tools\rig\beside.py" "$env:RIG_URL/models" "$env:RUNNER_TEMP\beside.txt" "$env:RUNNER_TEMP\watch-beside.out"
          "=== beside"; (Get-Content "$env:RUNNER_TEMP\watch-beside.out" | Select-String -Pattern "^run: |^TREES SEEN|^RESULT|FINDING ").Line
          python "$env:GITHUB_WORKSPACE\tools\rig\beside_read.py" "$env:RUNNER_TEMP\beside.txt"
      - name: qwen under the watch
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-qwen | Out-Null; Set-Location $env:RUNNER_TEMP\w-qwen
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-qwen.log" -NoNewWindow
          Start-Sleep 3
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-qwen.out -RedirectStandardError ..\watch-qwen.err -PassThru -NoNewWindow
          Start-Sleep 7
          $env:OPENAI_API_KEY = "rig"; $env:OPENAI_BASE_URL = $env:RIG_URL; $env:OPENAI_MODEL = "rig-model"
          # BC-7: the agent is started by an unknown program that then talks by itself (two trees, one under the other)
          $env:RIG_CMD = 'qwen -p "Do the task." --yolo > ..\agent-qwen.out 2>&1'
          $a = Start-Process python -ArgumentList "$env:GITHUB_WORKSPACE\tools\rig\launcher.py","10","$env:RIG_URL/models" -RedirectStandardOutput ..\launcher-qwen.out -PassThru -NoNewWindow
          if (-not $a.WaitForExit(130000)) { taskkill /T /F /PID $a.Id | Out-Null; "launcher: stopped at its time" }
          Get-Content ..\launcher-qwen.out
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-qwen.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-qwen.log
          "=== report"; $t = Get-Content ..\watch-qwen.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
          "=== rhythm"; python "$env:GITHUB_WORKSPACE\tools\rig\rhythm_read.py" node qwen opencode bun curl python
          "=== marks"; python "$env:GITHUB_WORKSPACE\tools\rig\marks_read.py"
          "=== reader"; python "$env:GITHUB_WORKSPACE\tools\rig\inv_read.py"
      - name: qwen under the watch, its connection kept (ADR-0007 BO, the bytes by the tracing)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-kept | Out-Null; Set-Location $env:RUNNER_TEMP\w-kept
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          $env:RIG_CLOSE = ""    # unset: the model keeps the connection: one connection, many turns
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-kept.log" -NoNewWindow
          Start-Sleep 3
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-kept.out -RedirectStandardError ..\watch-kept.err -PassThru -NoNewWindow
          Start-Sleep 7
          $env:OPENAI_API_KEY = "rig"; $env:OPENAI_BASE_URL = $env:RIG_URL; $env:OPENAI_MODEL = "rig-model"
          # BC-7: the agent is started by an unknown program that then talks by itself (two trees, one under the other)
          $env:RIG_CMD = 'qwen -p "Do the task." --yolo > ..\agent-kept.out 2>&1'
          $a = Start-Process python -ArgumentList "$env:GITHUB_WORKSPACE\tools\rig\launcher.py","10","$env:RIG_URL/models" -RedirectStandardOutput ..\launcher-kept.out -PassThru -NoNewWindow
          if (-not $a.WaitForExit(130000)) { taskkill /T /F /PID $a.Id | Out-Null; "launcher: stopped at its time" }
          Get-Content ..\launcher-kept.out
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-kept.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-kept.log
          "=== report"; $t = Get-Content ..\watch-kept.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
          "=== sessions of ours after the watch"; logman query -ets | Select-String "raqib"
          "=== bytes"; ($t | Select-String -Pattern "bytes|tracing|blind").Line | Select-Object -First 40
          "=== connections"; python "$env:GITHUB_WORKSPACE\tools\rig\conn_read.py"
          "=== rhythm"; python "$env:GITHUB_WORKSPACE\tools\rig\rhythm_read.py" node qwen opencode bun curl python
          "=== marks"; python "$env:GITHUB_WORKSPACE\tools\rig\marks_read.py"
          "=== reader"; python "$env:GITHUB_WORKSPACE\tools\rig\inv_read.py"
      - name: opencode under the watch
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\w-opencode | Out-Null; Set-Location $env:RUNNER_TEMP\w-opencode
          # a process started in an earlier step is ended with that step on a Windows runner: the model starts here
          Start-Process python -ArgumentList $env:RIG_MODEL,"--port","8790","--log","$env:RUNNER_TEMP\model-opencode.log" -NoNewWindow
          Start-Sleep 3
          $cfg = @{ '$schema' = "https://opencode.ai/config.json"; provider = @{ rig = @{ npm = "@ai-sdk/openai-compatible"; name = "Rig"; options = @{ baseURL = $env:RIG_URL; apiKey = "rig" }; models = @{ "rig-model" = @{ name = "Rig" } } } }; model = "rig/rig-model"; permission = @{ bash = "allow"; edit = "allow" } }
          $cfg | ConvertTo-Json -Depth 8 | Out-File opencode.json -Encoding utf8
          $w = Start-Process raqib -ArgumentList "watch","--host","--rounds","30","--every","5","--no-open" -RedirectStandardOutput ..\watch-opencode.out -RedirectStandardError ..\watch-opencode.err -PassThru -NoNewWindow
          Start-Sleep 7
          $a = Start-Process cmd -ArgumentList "/c","opencode run `"Do the task.`" > ..\agent-opencode.out 2>&1" -PassThru -NoNewWindow
          if (-not $a.WaitForExit(110000)) { taskkill /T /F /PID $a.Id | Out-Null; "opencode: stopped at its time" }
          $w.WaitForExit(200000) | Out-Null
          "=== agent"; Get-Content ..\agent-opencode.out -Tail 20
          "=== model log"; Get-Content $env:RUNNER_TEMP\model-opencode.log
          "=== report"; $t = Get-Content ..\watch-opencode.out; $i = ($t | Select-String -Pattern "^Raqib watch --host" | Select-Object -First 1).LineNumber; $t[($i-1)..($t.Count-1)]
          "=== rhythm"; python "$env:GITHUB_WORKSPACE\tools\rig\rhythm_read.py" node qwen opencode bun curl python
          "=== marks"; python "$env:GITHUB_WORKSPACE\tools\rig\marks_read.py"
          "=== reader"; python "$env:GITHUB_WORKSPACE\tools\rig\inv_read.py"

