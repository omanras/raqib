name: service-probe6
# Probe only (never merged): measured before ADR-0013's ruling on the second review - the making call at a link,
# and a plain user's file inside a folder closed after he put it there.
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/svc_probe6.ps1, .github/workflows/service-probe6.yml]
permissions:
  contents: read
jobs:
  service:
    name: the making call at a link; a file left inside (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: measured
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_probe6.ps1"
