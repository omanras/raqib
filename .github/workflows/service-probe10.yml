name: service-probe10
# Probe only (never merged): measured before ADR-0013's ruling on install, remove and status for Windows.
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/svc_probe10.py, tools/rig/svc_probe10.ps1, .github/workflows/service-probe10.yml]
permissions:
  contents: read
jobs:
  service:
    name: the system's answers to its service calls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: main's Raqib, installed
        shell: bash
        run: |
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD -- raqib pyproject.toml
          python -m pip install --disable-pip-version-check -q .
      - name: measured
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_probe10.ps1"
