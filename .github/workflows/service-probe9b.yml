name: service-probe9b
# Probe only (never merged): measured before ADR-0013's ruling on a plain interpreter's road and the drive's kind.
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/svc_probe9b.ps1, .github/workflows/service-probe9b.yml]
permissions:
  contents: read
jobs:
  service:
    name: the installer of python.org for all users (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: main's Raqib in the job's folder
        shell: bash
        run: |
          git fetch -q --depth 1 origin main
          git checkout -q FETCH_HEAD -- raqib pyproject.toml
      - name: measured
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_probe9b.ps1"
