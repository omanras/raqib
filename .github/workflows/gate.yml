# The constitutional gate on Linux and Windows (M5.1 E4), on every push and
# pull request: ubuntu and windows, Python 3.11 and 3.12. On ubuntu it runs
# through tools/gate.sh, which calls tools/gate.py; on Windows gate.py runs
# directly. No secret is needed: apart from installing pytest the gate is
# offline and reads only the tree. The install job (M6.3) builds and installs
# the package in a clean venv on both systems and runs it from outside the
# checkout.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Tests read and write their own files in the platform's default
      # encoding; UTF-8 mode makes that UTF-8 on Windows as it is on Linux.
      # Hooks run by the tests get a clean environment without it.
      PYTHONUTF8: "1"
      # The short summary names every skipped, xfailed, xpassed and passed
      # test, so per-test outcomes on Windows are in the job log (Amendment 4, R4).
      PYTEST_ADDOPTS: "-rsxXp"
    steps:
      # The tree is checked out byte for byte (LF), as on Linux; a clone with
      # core.autocrlf=true is not what this job tests.
      - name: check out without line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: tools/gate.sh
        if: runner.os != 'Windows'
        run: tools/gate.sh
      - name: tools/gate.py
        if: runner.os == 'Windows'
        run: python -I tools/gate.py

  # M6.3 E1: `pip install .` in a clean venv puts `raqib` on PATH. Run from
  # outside the checkout, the installed raqib reads its catalog and
  # endpoints.yaml from the venv, never from the checkout; the checkout is
  # used only for the fixtures it is pointed at. pip fetches the build
  # backend (setuptools); raqib itself has no dependency.
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: check out without line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clean venv, pip install . (Linux)
        if: runner.os != 'Windows'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check .
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: clean venv, pip install . (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install --disable-pip-version-check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: raqib from the venv, outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          command -v raqib
          # The raqib imported is the venv's, not the checkout's.
          python -c "import os, sys, raqib; p = os.path.normcase(os.path.realpath(raqib.__file__)); w = os.path.normcase(os.path.realpath(os.environ['GITHUB_WORKSPACE'])); print(p); sys.exit(p.startswith(w + os.sep))"
          raqib --help
          raqib watch --help
          raqib doctor --help
          # M6.4 E5: the window's command from the venv (help only: no window opens).
          raqib app --help
          # ADR-0006 A-7: the raqib-app gui launcher is in the venv, and the installed
          # dist-info's entry_points.txt has [gui_scripts] with raqib-app.
          python - <<'EOF'
          import glob, os, sys, sysconfig
          scripts = sysconfig.get_path("scripts")
          launcher = os.path.join(scripts, "raqib-app.exe" if os.name == "nt" else "raqib-app")
          print("launcher:", launcher)
          assert os.path.isfile(launcher), sorted(os.listdir(scripts))
          assert os.name == "nt" or launcher.endswith("bin/raqib-app"), launcher
          eps = glob.glob(os.path.join(sysconfig.get_path("purelib"), "raqib-*.dist-info", "entry_points.txt"))
          assert len(eps) == 1, eps
          text = open(eps[0], encoding="utf-8").read()
          print(text)
          assert "[gui_scripts]" in text, text
          section = text.split("[gui_scripts]", 1)[1].split("\n[", 1)[0]
          assert "raqib-app = raqib.app:gui_main" in section, section
          print("gui launcher: OK (Scripts/raqib-app.exe on Windows, bin/raqib-app elsewhere)")
          EOF
          # The installed catalog, measured on the checkout's fixtures.
          raqib check-rules --fixtures-root "$GITHUB_WORKSPACE"
          # Without fixtures an installed raqib says so (exit 2).
          set +e; raqib check-rules 2> nofixtures.txt; code=$?; set -e
          cat nofixtures.txt; test "$code" -eq 2; grep -F "no rule fixtures in" nofixtures.txt
          # The installed endpoints.yaml: the inventory names the catalog it read (exit 1: a candidate).
          set +e; raqib discover --from "$GITHUB_WORKSPACE/tests/fixtures/discover/linux" > discover.txt; code=$?; set -e
          cat discover.txt; test "$code" -eq 1
          grep -F "$(python -c 'from raqib import discover; print(discover.CATALOG)')" discover.txt
          # G-2: the wheel pip builds from the checkout, listed by python -m zipfile -l.
          python -m pip wheel --disable-pip-version-check --no-deps -w dist "$GITHUB_WORKSPACE"
          python -m zipfile -l dist/raqib-*.whl > wheel.txt
          cat wheel.txt
          # M7.1 E4 (ADR-0007): discover live, in-process, from the venv: on Windows 2 samples
          # 1 s apart through the Win32 API (no PowerShell), on Linux one /proc snapshot. An
          # inventory JSON is produced, the reader is named as itself and is no candidate.
          if [ "$RUNNER_OS" = "Windows" ]; then live="--samples 2 --every 1"; else live=""; fi
          set +e; raqib discover $live --json --save live-run -o live.json; code=$?; set -e
          echo "discover live: exit $code"; test "$code" -ne 2
          python - <<'EOF'
          import json, os
          inv = json.load(open("live.json", encoding="ascii"))
          run = json.load(open(os.path.join("live-run", "run.json"), encoding="ascii"))
          print(inv["result"], inv["exit"], "self", inv["self"], "candidates", [(c["pid"], c["image"]) for c in inv["candidates"]])
          assert inv["live"] is True and inv["records"] > 0 and inv["self"], inv["self"]
          # ADR-0007 A-7: the reader and its launchers (raqib.exe, the venv python.exe): every one
          # of them is in inv["self"], and none is a candidate, an act or an act-root.
          mine = set(inv["self"])
          assert not any(c["pid"] in mine for c in inv["candidates"]), "the reader is a candidate"
          assert not any(a["pid"] in mine for c in inv["candidates"] for a in c["acts"]), "the reader is an act"
          assert not any(a["pid"] in mine for a in inv["act_roots"]), "the reader is an act-root"
          if os.name == "nt":
              assert sorted(run["self"]) == sorted(mine), (run["self"], inv["self"])
              assert len(mine) >= 2, ("no launcher of the reader found (raqib.exe)", inv["self"])
              # The parent pids: run.json's self is the reader then its launchers, nearest first; in the
              # sample each one's ParentProcessId is the next, and each launcher is raqib*/python*.exe.
              import csv, re
              rows = {r["ProcessId"]: r for r in csv.DictReader(
                  line for line in open(os.path.join("live-run", "win-process-1.csv"), encoding="utf-8") if not line.startswith("#"))}
              chain = [str(p) for p in run["self"]]
              for child, parent in zip(chain, chain[1:]):
                  assert rows[child]["ParentProcessId"] == parent, (child, parent, rows[child])
                  assert re.match(r"(raqib|python|pythonw)[^\\/]*\.exe$", rows[parent]["Name"], re.I), rows[parent]
              assert "raqib.exe" in [rows[p]["Name"].lower() for p in chain[1:]], [rows[p]["Name"] for p in chain]
              assert inv["window"]["samples_read"] == [1, 2], inv["window"]
              assert run["samples"] == 2 and run["export"] == "windows-live" and len(run["sample_times"]) == 2, run
              assert any("GetExtendedTcpTable" in a for a in run["apis"]), run["apis"]
              names = sorted(os.listdir("live-run"))
              assert {"win-process-1.csv", "win-process-2.csv", "win-tcp-1.csv", "win-tcp-2.csv"} <= set(names), names
          print("discover live: OK, the reader and its launchers (pid %s) are no candidate" % sorted(mine))
          EOF
          # The saved run replays (A5, A8).
          set +e; raqib discover --from live-run --json -o replay.json; code=$?; set -e
          test "$code" -ne 2
          # ADR-0007 A-5: the replay is the live run: candidates, act_roots, their count, the holes' count.
          python -c "import json; a, b = (json.load(open(n, encoding='ascii')) for n in ('live.json', 'replay.json')); assert a['candidates'] == b['candidates'], 'replay: candidates differ'; assert a['act_roots'] == b['act_roots'] and len(a['act_roots']) == len(b['act_roots']), 'replay: act_roots differ'; assert len(a['holes']) == len(b['holes']), ('replay: hole count', len(a['holes']), len(b['holes'])); print('replay == live: %d candidate(s), %d act-root(s), %d hole(s)' % (len(b['candidates']), len(b['act_roots']), len(b['holes'])))"
          # M7.2 E6 (ADR-0007 decision 2): the host watch from the venv, 2 rounds 1 s apart, read-only.
          # REDO C-8: `raqib discover --json` in the same job first; every candidate pid it names must be
          # among the watch report's trees; stderr is kept apart and read for a Traceback too.
          # REDO C-10: the runner's trees are there at the start (history), so on Windows the watch
          # exits 0 (CLEAN, the trees named); 3 (a round not read) or 1 (a finding) are reported.
          # One sample on Windows, as a host round reads (Q-1, C-13); Linux: one /proc snapshot.
          if [ "$RUNNER_OS" = "Windows" ]; then one="--samples 1"; else one=""; fi
          set +e; raqib discover $one --json -o host-discover.json > /dev/null 2> host-discover-err.txt; dcode=$?; set -e
          cat host-discover-err.txt; ! grep -q "Traceback" host-discover-err.txt
          echo "discover before the host watch: exit $dcode"; test "$dcode" -ne 2
          set +e; raqib watch --host --every 1 --rounds 2 --no-notify > host.txt 2> host-err.txt; code=$?; set -e
          cat host.txt; cat host-err.txt; echo "watch --host: exit $code"; test "$code" -ne 2
          HOST_EXIT="$code" python - <<'EOF'
          import json, os, re
          text = open("host.txt", encoding="utf-8", errors="replace").read()
          err = open("host-err.txt", encoding="utf-8", errors="replace").read()
          for name, body in (("host.txt", text), ("host-err.txt", err)):
              assert "Traceback" not in body and "CRASHED" not in body, (name, body[-2000:])
          assert "raqib watch --host: 2 round(s) done (--rounds)" in text, text[-2000:]
          result = re.search(r"^RESULT: ([A-Z-]+) \(exit ([0-9]): [^)]*\)$", text, re.M)
          assert result and int(result.group(2)) == int(os.environ["HOST_EXIT"]), (result, os.environ["HOST_EXIT"])
          rounds = re.findall(r"^\[[0-9:]+Z\] round ([0-9]+)(?: \(late, [0-9.]+ s\))?: ([0-9]+) records read", text, re.M)
          assert [r for r, _ in rounds] == ["1", "2"] and all(int(n) > 0 for _, n in rounds), rounds
          seen = re.search(r"^TREES SEEN: ([0-9]+) ", text, re.M)
          assert seen, text[-2000:]
          trees = re.findall(r"^  \[(candidate|act-root)\] pid ([0-9]+) (\S+) \((named|unknown)", text, re.M)
          print("trees:", trees)
          assert int(seen.group(1)) == len(trees) and (trees or "NO AGENT SEEN in 2 round(s)" in text), text[-2000:]
          # C-8: the runner's trees, as discover saw them in this job, are the watch's trees.
          inv = json.load(open("host-discover.json", encoding="ascii"))
          want = sorted({c["pid"] for c in inv["candidates"]})
          got = {int(pid) for _, pid, _, _ in trees}
          print("discover candidates:", [(c["pid"], c["image"]) for c in inv["candidates"]])
          assert set(want) <= got, ("discover candidate pid(s) missing from the watch's trees", sorted(set(want) - got))
          if os.name == "nt":
              assert want, "no candidate on the Windows runner (M7.1 found the Actions agents)"
          # C-10: history trees only, nothing new, every round read: exit 0 on windows.
          new = re.search(r"^FINDINGS: ([0-9]+)$", text, re.M)
          expect = 0 if os.name == "nt" else None
          if expect is not None and new and new.group(1) == "0" and "reader-" not in text:
              assert int(os.environ["HOST_EXIT"]) == expect and result.group(1) == "CLEAN", result.group(0)
          record = re.search(r"^record: (.+); latest inventory: (.+)$", text, re.M)
          lines = [json.loads(x) for x in open(record.group(1), encoding="ascii").read().splitlines()]
          run = re.search(r"^run: (\S+) ", text, re.M).group(1)
          mine = [x for x in lines if x.get("run") == run]
          assert [x["round"] for x in mine] == [1, 2], [(x.get("run"), x["round"]) for x in lines]
          latest = json.load(open(record.group(2), encoding="ascii"))
          assert latest["live"] is True and latest["host_watch"]["run"] == run, latest.get("host_watch")
          state = json.load(open(record.group(1) + ".watch.json", encoding="ascii"))
          assert state["mode"] == "host" and state["finished"] and state["host"]["rounds"] == 2, state["host"]
          assert state["run"] == run, state["run"]
          print("watch --host: OK, %s tree(s), %s" % (seen.group(1), result.group(0)))
          EOF
          # Doctor from the venv (exit 1 here: see the exact MISSING lines below).
          mkdir -p project
          set +e; raqib doctor project > doctor.txt 2>&1; code=$?; set -e
          cat doctor.txt; test "$code" -eq 1
          python - <<'EOF'
          import glob, os, shutil, subprocess
          windows = os.name == "nt"
          # The wheel holds the capture hook, the checkout's catalog YAMLs and endpoints.yaml.
          # The catalog is counted from the checkout (its tracked rule files), never a literal (ADR-0002 D-2).
          names = {line.split()[0] for line in open("wheel.txt", encoding="utf-8").read().splitlines()[1:] if line.strip()}
          catalog = sorted("raqib/rules/catalog/" + os.path.basename(p) for p in glob.glob(
              os.path.join(os.environ["GITHUB_WORKSPACE"], "raqib", "rules", "catalog", "*.yaml")))
          tracked = subprocess.run(["git", "-C", os.environ["GITHUB_WORKSPACE"], "ls-files", "raqib/rules/catalog"],
                                   capture_output=True, text=True, check=True).stdout.split()
          assert catalog and catalog == sorted(p for p in tracked if p.endswith(".yaml") and p.count("/") == 3), (catalog, tracked)
          want = set(catalog) | {"raqib/hooks/capture.py", "raqib/discover/endpoints.yaml"}
          assert want <= names, sorted(want - names)
          assert sorted(n for n in names if n.startswith("raqib/rules/catalog/")) == catalog, names
          # Doctor: exactly these MISSING lines on a runner (no claude, no hooks, CI set;
          # Windows: no Sysmon), and on Windows the trace UNSURE (H-1: not checkable there).
          lines = open("doctor.txt", encoding="utf-8", errors="replace").read().splitlines()
          assert not any("Traceback" in line for line in lines), lines
          missing = {line[8:17].strip(): line[17:] for line in lines if line.startswith("MISSING ")}
          unsure = {line[8:17].strip(): line[17:] for line in lines if line.startswith("UNSURE ")}
          # M6.4: the tkinter line. setup-python's Python ships tkinter; the Linux runner
          # has no DISPLAY (UNSURE), the Windows runner needs none (OK). ADR-0006 A-9: a
          # missing tkinter is UNSURE too ("the window needs it (python3-tk); watch does not").
          try:
              import tkinter
              has_tk = True
          except ImportError:
              has_tk = False
          expected = ["claude", "hooks", "notifier"] + (["sysmon"] if windows else [])
          assert sorted(missing) == sorted(expected), missing
          tk_unsure = (not has_tk) or (not windows and not os.environ.get("DISPLAY"))
          want_unsure = (["trace"] if windows else []) + (["tkinter"] if tk_unsure else [])
          assert sorted(unsure) == sorted(want_unsure), unsure
          if not has_tk:
              assert unsure["tkinter"].startswith("the window needs it (python3-tk); watch does not"), unsure
          assert missing["claude"] == "not on PATH (install Claude Code; the hooks are Claude Code hooks)", missing
          assert missing["hooks"].endswith(": missing for all 6 events; `raqib watch` installs this raqib's"), missing
          assert missing["notifier"] == "off (CI is set: no notification is shown in CI)", missing
          if windows:
              assert missing["sysmon"].startswith("no event channel Microsoft-Windows-Sysmon/Operational"), missing
              assert unsure["trace"].endswith("; not checked (os.access cannot tell on Windows)"), unsure
          assert lines[-1] == "raqib doctor: %d MISSING, %d UNSURE" % (len(expected), len(unsure)), lines[-1]
          # The console script with output its console cannot encode (a non-cp1252
          # character in the project's name): escaped, no crash.
          name = "proj-" + chr(0x631)
          os.makedirs(name, exist_ok=True)
          env = dict(os.environ, PYTHONIOENCODING="cp1252" if windows else "ascii")
          proc = subprocess.run([shutil.which("raqib"), "doctor", name], capture_output=True, env=env, timeout=120)
          print(proc.stdout.decode("ascii", "replace"))
          assert proc.returncode == 1 and b"Traceback" not in proc.stderr, proc
          assert b"proj-\\u0631" in proc.stdout, proc.stdout
          print("install checks: OK")
          EOF
