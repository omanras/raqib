name: service-probe14
# Probe only (never merged): the fourteenth measurement - a service made as the install would make it, read back and removed
# (ADR-0013 Amendment V), asked by an administrator and by a plain user.
on:
  push:
    branches: [claude/rig-probe]
    paths: ["tools/rig/svc_probe14.*", .github/workflows/service-probe14.yml]
permissions:
  contents: read
env:
  RAQIB_REF: main
jobs:
  field:
    name: a service made as the install would, on real Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the branch's Raqib and its tests
        shell: bash
        run: |
          git fetch -q --depth 1 origin "$RAQIB_REF"
          git checkout -q FETCH_HEAD -- raqib tests docs pyproject.toml tools/rig/check.py
          git rev-parse --short FETCH_HEAD
          python -m pip install --disable-pip-version-check -q . pytest
      - name: asked in the field
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_probe14.ps1"
