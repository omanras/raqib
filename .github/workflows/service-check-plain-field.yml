name: service-check-plain-field
# Probe only (never merged): the field's word on a branch's `raqib service check` for a plain interpreter
# (ADR-0013 Amendments M to O).
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/svc_check_plain_field.ps1, .github/workflows/service-check-plain-field.yml]
permissions:
  contents: read
env:
  RAQIB_REF: claude/M12.4c1b
jobs:
  field:
    name: raqib service check, a plain interpreter, on real Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the branch's Raqib, its tests and its rig tools
        shell: bash
        run: |
          git fetch -q --depth 1 origin "$RAQIB_REF"
          git checkout -q FETCH_HEAD -- raqib tests docs pyproject.toml tools/rig/check.py tools/rig/service_check.ps1 tools/rig/service_check_plain.ps1 tools/rig/pack.sh
          git rev-parse --short FETCH_HEAD
          python -m pip install --disable-pip-version-check -q . pyinstaller==6.11.1 pytest
      - name: the check's own tests on this machine
        shell: pwsh
        run: |
          python -m pytest tests/test_wincode.py -q -rs 2>&1 | Select-Object -Last 8
          exit 0
      - name: the rig's own two steps, and what X49 and X50 read of them
        shell: pwsh
        run: |
          & tools\rig\service_check.ps1 -Out $env:RUNNER_TEMP\service-check | Select-Object -Last 3
          & tools\rig\service_check_plain.ps1 -Out $env:RUNNER_TEMP\service-check-plain
          python -c "import sys; sys.path.insert(0, 'tools/rig'); import check; [print(r) for r in check.read_service_check(open(sys.argv[1], encoding='utf-8-sig').read())]; [print(r) for r in check.read_service_check_plain(open(sys.argv[2], encoding='utf-8-sig').read())]" $env:RUNNER_TEMP\service-check\service-check.txt $env:RUNNER_TEMP\service-check-plain\service-check-plain.txt
          exit 0
      - name: asked in the field
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_check_plain_field.ps1"
