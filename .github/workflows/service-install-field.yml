name: service-install-field
# Probe only (never merged): the fifteenth measurement - a branch's `raqib service install | remove` on real
# Windows (ADR-0013 Amendment X), asked by an administrator and by a plain user.
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/svc_install_field.ps1, .github/workflows/service-install-field.yml]
permissions:
  contents: read
env:
  RAQIB_REF: claude/M12.4c2b2b
jobs:
  field:
    name: raqib service install and remove on real Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the branch's Raqib, its tests and its rig tools
        shell: bash
        run: |
          git fetch -q --depth 1 origin "$RAQIB_REF"
          git checkout -q FETCH_HEAD -- raqib tests docs pyproject.toml tools/rig/check.py tools/rig/service_check.ps1 tools/rig/pack.sh
          git rev-parse --short FETCH_HEAD
          python -m pip install --disable-pip-version-check -q . pyinstaller==6.11.1 pytest
      - name: the install's, the status's, the Linux command's and the libraries' tests on this machine
        shell: pwsh
        run: |
          python -m pytest tests/test_wininstall.py tests/test_winmanager.py tests/test_service.py tests/test_libraries.py -q -rs 2>&1 | Select-Object -Last 12
          "a service of the name after the tests: $([bool](Get-CimInstance Win32_Service -Filter "Name='RaqibWatch'"))"
          exit 0
      - name: the rig's own packed copy
        shell: pwsh
        run: |
          & tools\rig\service_check.ps1 -Out $env:RUNNER_TEMP\service-check | Select-Object -Last 3
          exit 0
      - name: asked in the field
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\rig\svc_install_field.ps1" -PackedDir "$env:RUNNER_TEMP\service-check\pack\dist\raqib"
