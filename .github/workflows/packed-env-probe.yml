name: packed-env-probe
# Probe only (never merged): the field's word for ADR-0007 CI-5 - a branch's raqib.own and Raqib's entry, packed
# with the rig's packer's own options, on the three systems.
on:
  push:
    branches: [claude/rig-probe]
    paths: [tools/rig/packed_env_probe.py, tools/rig/packed_env_entry2.py, .github/workflows/packed-env-probe.yml]
permissions:
  contents: read
env:
  RAQIB_REF: claude/M17.2b
jobs:
  packed-env:
    name: what a packed Raqib hands on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the branch's Raqib, and the packer
        shell: bash
        run: |
          git fetch -q --depth 1 origin "$RAQIB_REF"
          git log -1 --format='%h %s' FETCH_HEAD
          git checkout -q FETCH_HEAD -- raqib pyproject.toml tools/rig/pack.sh
          python -m pip install --disable-pip-version-check -q . pyinstaller==6.11.1
          raqib --version
      - name: pack the instrument and Raqib as the rig packs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pe" && cd "$RUNNER_TEMP/pe"
          cp "$GITHUB_WORKSPACE/tools/rig/packed_env_entry2.py" entry.py
          python -m PyInstaller --noconfirm --onedir --name ownprobe --collect-all raqib --exclude-module tkinter --log-level WARN entry.py 2>&1 | tail -3
          printf 'import sys\nfrom raqib.cli import main\nsys.exit(main())\n' > rentry.py
          python -m PyInstaller --noconfirm --onedir --name raqib --collect-all raqib --exclude-module tkinter --log-level WARN rentry.py 2>&1 | tail -3
          ls dist
      - name: what raqib.own and the entry did
        shell: bash
        run: |
          exe="$RUNNER_TEMP/pe/dist/ownprobe/ownprobe"; if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          rq="$RUNNER_TEMP/pe/dist/raqib/raqib"; if [ -f "$rq.exe" ]; then rq="$rq.exe"; fi
          python tools/rig/packed_env_probe.py --own "$exe" --raqib "$rq"
      - name: the packed watch itself, whole
        shell: bash
        run: |
          rq="$RUNNER_TEMP/pe/dist/raqib/raqib"; if [ -f "$rq.exe" ]; then rq="$rq.exe"; fi
          export HOME="$RUNNER_TEMP/phome" USERPROFILE="$RUNNER_TEMP/phome"; mkdir -p "$HOME"
          set +e
          "$rq" watch --host --rounds 3 --every 3 --no-open --no-page > "$RUNNER_TEMP/watch.out" 2> "$RUNNER_TEMP/watch.err"
          echo "packed watch: exit $?; $(wc -l < "$RUNNER_TEMP/watch.out") line(s); stderr $(wc -l < "$RUNNER_TEMP/watch.err") line(s)"
          grep -n -i "RESULT\|HOLES\|librar\|own-\|rounds asked\|Traceback\|CHANNEL" "$RUNNER_TEMP/watch.out" "$RUNNER_TEMP/watch.err" | cut -c1-260 | head -30
