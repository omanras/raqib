title: Whoami executed by an interactive user
id: 7f2d3e4a-5b6c-4d7e-9f80-1a2b3c4d5e61
status: experimental
description: |
  whoami.exe tells an operator which account and privileges a foothold has;
  it is one of the first commands after a compromise. Service accounts under
  NT AUTHORITY run it from scheduled scripts and are filtered. Synthetic
  example rule.
author: Mizan examples
date: 2026/10/17
tags:
  - attack.discovery
  - attack.t1033
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\whoami.exe'
  filter_system:
    User|startswith: 'NT AUTHORITY\'
  condition: selection and not filter_system
falsepositives:
  - Help-desk and administrator sessions
level: low
x-mizan:
  fp_budget: 30
