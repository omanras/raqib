title: PowerShell started with an encoded command
id: 5e0c1a2b-3d4e-4f60-8a71-0b1c2d3e4f50
status: experimental
description: |
  PowerShell or pwsh launched with -EncodedCommand (or its short forms),
  which hides the script body from the command line. Administrators use it
  rarely; loaders and droppers use it often. Synthetic example rule.
author: Mizan examples
date: 2026/10/17
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -enc '
      - ' -ec '
  condition: all of selection_*
falsepositives:
  - Deployment and backup scripts that pass their body encoded
level: high
x-mizan:
  fp_budget: 20
