title: SSH password login as root
id: 1c5a6b7d-8e9f-4a01-b2c3-4d5e6f7a8b94
status: experimental
description: |
  Password authentication for the root account over SSH. Policy says root
  logs in with keys through the bastion or not at all; a password login as
  root is either a misconfiguration or a brute force that succeeded.
  Synthetic example rule.
author: Mizan examples
date: 2026/10/17
tags:
  - attack.initial-access
  - attack.t1078.003
  - attack.t1110
logsource:
  product: linux
  service: auth
detection:
  selection:
    process: sshd
    message|startswith: 'Accepted password for root '
  condition: selection
falsepositives:
  - Appliances that only offer root with a password
level: high
x-mizan:
  fp_budget: 0
