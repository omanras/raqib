# Dawr with Docker Compose (docs/OPERATIONS.md has the whole procedure).
#
#   cp deploy/env.example deploy/.env      # then fill in the three values
#   docker compose -f deploy/compose.yml --profile caddy up -d --build
#
# Services:
#   dawr   the application. Read-only root filesystem, no capabilities,
#          unprivileged user, one volume (/data). Published on the host's
#          loopback only (127.0.0.1:${DAWR_PORT}), so nothing outside the
#          machine reaches it except through the reverse proxy.
#   caddy  optional (profile "caddy"): terminates TLS for the host of
#          BASE_URL with automatic certificates and forwards to dawr:3000. Leave the
#          profile out when the host already runs a reverse proxy; point it
#          at http://127.0.0.1:${DAWR_PORT} and have it set X-Forwarded-For.
#
# Values come from deploy/.env (never committed) or the shell environment.
name: dawr

services:
  dawr:
    image: ${DAWR_IMAGE:-dawr:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env (see deploy/env.example)}
      BASE_URL: ${BASE_URL:?set BASE_URL in deploy/.env, e.g. https://dawr.example.org}
      # Dawr only ever sits behind the proxy; one trusted hop.
      TRUST_PROXY: '1'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - dawr-data:/data
    ports:
      - '127.0.0.1:${DAWR_PORT:-3000}:3000'
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10}
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      dawr:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    environment:
      # The site Caddy serves and certifies: the same origin members open.
      BASE_URL: ${BASE_URL:?set BASE_URL in deploy/.env, e.g. https://dawr.example.org}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  dawr-data:
  caddy-data:
  caddy-config:
