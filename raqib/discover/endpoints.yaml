# Agent discovery catalog (ADR-0004 layers 1 and 4; M5.0). Loaded by
# raqib/discover.py with raqib/rules/yamlite.py.
#
# Everything here is a signature and supporting only. The anchor - a process
# that talks (outbound TCP) and has a child (any child: the act names below
# only label it), or writes a file outside config space - reads none of
# this file, so a name missing here hides nothing from it. This file is the
# one thing an adversary can read and route around (ADR-0004); `evasion:`
# says how.
#
# Kimi / Moonshot hosts were left out until ADR-0004's first field test, which
# ran "with no prior knowledge of Kimi" (B-10; field note
# docs/review/2026-11-02-field-note-kimi-discover.md). M5.0b lists them, so a
# DNS cache row or a TIME-WAIT row to them is recent talk (E2). A blind test
# runs with a --catalog copy without them, as B-10 did.
#
# act_root (M5.0b E3) is the one block that judges a tree: a weaker class than
# a candidate, a signature because the image path is the process's own record.
id: DISCOVER-CATALOG
kind: signature
evasion:
  - "a private, self-hosted or unlisted model endpoint (the tree anchor still holds)"
  - "an HTTPS proxy, tunnel or VPN: the remote address is the relay, not the model host"
  - "a local model server on a port not listed here, or a listed server moved to another port"
  - "no name record: Linux keeps none offline in M5.0; on Windows DNS over HTTPS or a hosts-file entry leaves no DNS cache line"
  - "a vendor network not listed (most vendors publish no stable API range; only names identify them)"
  - "a config directory renamed or moved (CLAUDE_CONFIG_DIR, XDG paths) or deleted after install"
  - "a key read from a file or a keychain instead of a *_API_KEY variable"
  - "QUIC / HTTP/3 or other UDP transport: only TCP is read as talk"
  - "a unix-socket relay: the agent talks to a local proxy over a unix socket and the proxy talks out"
  - "reparenting: a child started with setsid, nohup or a double fork leaves the talker's tree"
  - "sibling split: the process that talks and the one that has children are siblings, not ancestor and child"
# Model API host names (lower case; fnmatch globs). Matched against names the
# host recorded: Windows DNS client cache, Sysmon 22 QueryName, Sysmon 3
# DestinationHostname.
hosts:
  - {match: api.anthropic.com, vendor: anthropic}
  - {match: api.openai.com, vendor: openai}
  - {match: "*.openai.azure.com", vendor: azure-openai}
  - {match: generativelanguage.googleapis.com, vendor: google}
  - {match: "*aiplatform.googleapis.com", vendor: google-vertex}
  - {match: "bedrock-runtime.*.amazonaws.com", vendor: aws-bedrock}
  - {match: api.mistral.ai, vendor: mistral}
  - {match: api.deepseek.com, vendor: deepseek}
  - {match: api.groq.com, vendor: groq}
  - {match: api.together.xyz, vendor: together}
  - {match: openrouter.ai, vendor: openrouter}
  - {match: api.x.ai, vendor: xai}
  - {match: api.cohere.com, vendor: cohere}
  - {match: api.fireworks.ai, vendor: fireworks}
  - {match: "*.githubcopilot.com", vendor: github-copilot}
  - {match: "*.cursor.sh", vendor: cursor}
  # Moonshot (Kimi, Kimi Code): host names only, no network; from vendor docs,
  # not re-checked offline (G-11). Field runs stay blind with a --catalog copy
  # without them (B-10).
  - {match: api.moonshot.ai, vendor: moonshot}
  - {match: api.moonshot.cn, vendor: moonshot}
  - {match: api.kimi.com, vendor: moonshot}
# Model API networks, matched by IP (the only endpoint match Linux has
# offline in M5.0).
networks:
  - {cidr: 160.79.104.0/23, vendor: anthropic, note: "api.anthropic.com; 160.79.104.10 seen in tests/fixtures/discover/linux/ss.txt; range from Anthropic's published IP list, not re-checked offline"}
# Local model servers: matched only when the remote address is loopback.
ports:
  - {port: 11434, name: ollama}
  - {port: 1234, name: lm-studio}
  - {port: 1337, name: jan}
  - {port: 8000, name: vllm, note: "generic; supporting only"}
  - {port: 8080, name: llama.cpp-server, note: "generic; supporting only"}
# Act names (B-6): a signature that only LABELS a child. The anchor is "talks
# and has a child"; a child whose name is not here still counts.
acts:
  names: [sh, bash, dash, zsh, ksh, fish, cmd, powershell, pwsh, "python*", node, git]
  evasion:
    - "rename-by-copy: a shell or interpreter copied under another name is not labelled"
    - "a custom shell or a tool the agent ships itself"
    - "interpreters not listed (perl, ruby, deno, bun, ...) and build tools (make, cargo, npx)"
# Hand-off to a capture source (ADR-0003; D-5). Signatures too: they pick
# the source, never whether a tree is a candidate.
handoff:
  # hook: a root image named claude (claude.exe), unless its path matches a
  # Claude Desktop pattern (case-insensitive substring of the image path).
  hook:
    images: [claude]
    not_paths: [AnthropicClaude, Claude.app, claude-desktop]
    evasion:
      - "the Claude Code CLI under another image name (npm: node .../claude-code/cli.js) gets os, not hook"
      - "Claude Desktop installed at a path not listed gets hook, which it does not offer; os would still watch the tree"
      - "any other program named claude gets hook"
  # proxy: a root that goes by a name whose CLI documents a base-URL setting.
  proxy:
    proxy_capable: [codex, aider]
    evasion:
      - "a CLI with a base-URL setting not listed here gets os"
      - "a listed CLI with a fixed endpoint or a pinned certificate ignores a proxy"
# Footprints: paths relative to a home ('/'-separated; a glob in the last part
# only) and the program name an agent runs as, to link a footprint to a tree.
footprints:
  - {match: .claude, agent: claude}
  - {match: .claude.json, agent: claude}
  - {match: AppData/Roaming/Claude/claude_desktop_config.json, agent: claude}
  - {match: .codex, agent: codex}
  - {match: .gemini, agent: gemini}
  - {match: .cursor, agent: cursor}
  - {match: ".aider*", agent: aider}
  - {match: .kimi, agent: kimi}
# Variable NAMES in a process environment (never values; E4).
env:
  - "*_API_KEY"
# Act-root (M5.0b E3; ADR-0004 Amendments F and G): "act root, talk not
# seen". A process P is an act-root when all of these hold:
# - its image path is under a user directory (user_dirs);
# - none of its names is a listed shell or system image (shells, not_images);
# - its own parent is a listed shell or terminal host (launchers, G-1a): a
#   program started from a GUI (explorer, a desktop session, an IDE) is not;
# - neither P nor any hop below it carries `--type=` in its argv (an
#   Electron/Chromium helper, G-1b);
# - its child is a listed shell, with a command below that shell whose image
#   is not under P's own directory (G-1c);
# - P owns no talking connection in any sample.
# A later sample in which P talks makes it a candidate instead (the window
# merge); recent talk (a TIME-WAIT or DNS cache row, owner unknown) never
# does. Exit 1, like a candidate. fp_budget is measured by
# `raqib discover --check` on the fixtures below (A6); status disabled is
# the Table's act (G-8): then no inventory judges act-roots, and --check
# still measures them.
act_root:
  kind: signature
  status: ok
  fp_budget: 0.25
  # Image paths, lower case, with '\' read as '/'; fnmatch globs ('*' also
  # matches '/'). Users\<name> on any drive, macOS /Users, /home, root's home,
  # and AppData anywhere. Windows: ExecutablePath; Linux: /proc/PID/exe, else
  # argv[0] (G-2).
  user_dirs: ["?:/users/*/*", "/users/*/*", "/home/*/*", "/root/*", "*/appdata/*"]
  # The head of a chain. A program named like one is never an act-root.
  shells: [sh, bash, dash, zsh, ksh, fish, cmd, powershell, pwsh]
  # Besides a shell, the parents an act-root may have (G-1a): terminal hosts
  # and multiplexers.
  launchers: [conhost, mintty, kitty, wezterm, wezterm-gui, alacritty, gnome-terminal-server, tmux, screen]
  # System images, and the terminal hosts and multiplexers that run the
  # user's own shell. A program named like one is never an act-root.
  not_images: [explorer, conhost, openconsole, windowsterminal, wt, mintty, sshd, tmux, screen, gnome-terminal-server, konsole, xterm, kitty, alacritty, wezterm, wezterm-gui]
  evasion:
    - "install under Program Files, /usr, /opt or any other directory not in user_dirs: the image is not in a user directory"
    - "a blank image path: a process whose ExecutablePath the export left empty (another user's, or the export not elevated) is not placed (G-4)"
    - "a shell-looking name: a program named like a listed shell or a listed system image (bash.exe, cmd.exe, tmux) is never an act-root"
    - "terminal hosts and multiplexers in not_images (mintty, tmux, kitty, wezterm, ...) trade a masquerade for fewer false positives: an agent named like one is never an act-root"
    - "launch from a GUI launcher: a root whose parent is no listed shell or launcher (explorer, a desktop session, an IDE, a service, a double fork to init) is never an act-root (G-1a)"
    - "a --type= argument: a process that carries --type= in its argv, as Electron and Chromium helpers do, is neither a root nor a hop (G-1b)"
    - "talking through a child: a root whose connections a child owns is never seen to talk, so it stays an act-root and is not promoted; the chain beside that child is the anchor's sibling-talker hole"
    - "a non-shell hop: root -> helper -> shell makes the helper, not the root, the one to judge; a helper outside the user directories or with --type= hides the chain"
    - "no listed shell in the chain: a command started directly (git, python, curl) or through an unlisted shell (tcsh, nu, a renamed copy) makes no chain"
    - "acts inside the shell: builtins, cmdlets and redirections start no command process"
    - "a command under the root's own directory (a tool it ships) is not a command of the chain (G-1c)"
    - "wsl, a VM or a container: commands run there are not in this host's process table"
    - "a chain alive only between samples: the shell and its command must be alive at a sample (liveness)"
    - "an interpreter outside the user directories running a script inside one (node from Program Files, python from /usr): the image is the interpreter"
    - "Linux: an exe link that cannot be read (another user's process) falls back to argv[0], the process's own text; a relative argv[0] is not placed"
  # Fixture directories, relative to a checkout (as the rules' fixtures are).
  # positive: act_root names an act-root, promoted names a program that must
  # be a candidate and not an act-root; cite is a SRC:LINE the entry must
  # cite (G-8). negative: benign exports; an act-root on one is a false
  # positive.
  fixtures:
    positive:
      - {dir: tests/fixtures/discover/kimi/one-sample, act_root: kimi, cite: "win-process-1:12"}
      - {dir: tests/fixtures/discover/kimi/two-samples, promoted: kimi, cite: "win-tcp-2:7"}
      - {dir: tests/fixtures/discover/linux-agent, act_root: agent, cite: "proc:9"}
    negative:
      - tests/fixtures/discover/benign/linux-desktop
      - tests/fixtures/discover/benign/windows-desktop
# Benign images (M7.2 REDO, ADR-0007 Amendment C, C-1d): programs a desktop
# runs that talk and have a child (a browser, the shell, an IDE). Under
# `raqib watch --host` a new tree whose root is one of them is listed with
# `benign` and not knocked (NEW-AGENT, NEW-AGENT-UNKNOWN). A signature: the
# match needs the image name listed AND the image path under one of `dirs`
# and under none of `exclude`; a path that was denied, left blank, or read
# from the process's own argv[0] (Linux, an exe link not read) never
# matches. REDO-2 (Amendment D, D-3): the Windows globs are rooted at the
# system drive, the drive of SystemRoot that raqib/hostwin.py records in
# run.json (`%systemdrive%`, never any drive); a run record without it
# makes no Windows image benign (a hole). `exclude` names the places under
# SystemRoot a user can write without elevation.
# Started from what the benign fixtures show (tests/fixtures/discover/benign,
# the browser of tests/fixtures/discover/windows). The CI runner's own
# images (Runner.Worker, Runner.Listener, hosted-compute-agent) are NOT
# here: they talk and act, they are agents.
benign_images:
  kind: signature
  # Image names (lower case, no .exe), as discover.image_name gives them.
  names: [explorer, code, msedge, firefox]
  # fnmatch globs over the image path: Windows paths lower case with '/',
  # `%systemdrive%` replaced by the recorded system drive (SystemRoot,
  # Program Files, Program Files (x86) on that drive only); POSIX paths as
  # they are (case-sensitive).
  dirs: ["%systemdrive%/windows/*", "%systemdrive%/program files/*", "%systemdrive%/program files (x86)/*", "/usr/*", "/bin/*", "/sbin/*", "/lib/*", "/opt/*"]
  # M7.8 (ADR-0007 Amendment P, P-3): a name benign only under its own directories on the
  # system drive (never under `dirs`): Windows Defender's engine, which talks and has a child.
  pinned:
    - {name: msmpeng, dirs: ["%systemdrive%/programdata/microsoft/windows defender/*", "%systemdrive%/program files/windows defender/*"]}
  # D-3: user-writable places under SystemRoot, never benign.
  exclude: ["%systemdrive%/windows/temp/*", "%systemdrive%/windows/tasks/*", "%systemdrive%/windows/tracing/*", "%systemdrive%/windows/registration/*", "%systemdrive%/windows/system32/tasks/*", "%systemdrive%/windows/system32/spool/*", "%systemdrive%/windows/syswow64/tasks/*"]
  evasion:
    - "an agent that takes a benign program's name and is installed under a listed directory (an elevated install, a package, a copy into Program Files or /opt) is listed as benign and never knocked"
    - "an agent that runs inside a benign program (a browser extension, an IDE extension, a script run by the shell) is the benign program's tree"
    - "a benign program driven by an agent (remote debugging, automation of a browser or an IDE) is benign"
    - "Linux: a process may rename itself; the name is checked against the image path's own basename, so a renamed process outside the listed directories is not benign"
    - "D-3 another drive's windows/: a user can create D:\\Windows or D:\\Program Files on a data drive and put an agent named explorer there; only the system drive (SystemRoot's, recorded in run.json) is benign, and a run record without it makes no Windows image benign; an agent that starts the reader with SystemRoot pointing at another drive's Windows moves the benign directories with it"
    - "P-3 (M7.8) msmpeng (Windows Defender's engine) is benign only under the system drive's ProgramData\\Microsoft\\Windows Defender or Program Files\\Windows Defender: an agent named MsMpEng.exe copied there is listed as benign and never knocked; on a default install both directories are written only by SYSTEM, TrustedInstaller and administrators (and Defender's tamper protection guards its own), so the copy needs administrator rights; a copy anywhere else (a user directory, another drive, Program Files\\x) is not benign and knocks"
    - "D-3 a user-writable place under SystemRoot: %SystemRoot%\\Temp, Tasks, Tracing, Registration, System32\\Tasks, System32\\spool, SysWOW64\\Tasks are excluded by name; another place under SystemRoot that a user may write (a subdirectory with an ACL of its own) is still taken as benign"
