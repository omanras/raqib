# The think-act cycle of a tree, from the host's own record (M7.4, ADR-0007 decision 4; ADR-0004 layer 3).
id: HOST-RHYTHM
title: A tree talks to one destination and then starts a child, again and again
# HOST: the rules of raqib watch --host (engine.CLASSES), over rounds.jsonl's HostTree lines.
class: HOST
attack: [T1059, T1071]
# ADR-0002: measured against the host's own record of each round (the
# process tree and its children's start times, the TCP table and, on
# Linux, the sockets' byte counts), which the agent does not write.
# raqib/host.py computes each HostTree line's input_meta.rhythm from the
# tree's last R rounds (as HOST-UNWATCHED's none_rounds is computed). M7.4
# REDO K-5: a talk beat is a connection to one remote host:port that is NEW
# in the round, or an established one whose bytes moved since the last
# round its bytes were read; where no bytes are read (Windows; Linux
# without ss byte counts) an established connection is one talk, when first
# seen. An act is a child first seen in the round, at its start time
# (Windows GetProcessTimes; Linux /proc/PID/stat starttime + /proc/stat
# btime), else at the round's time (a blind spot of the run). A cycle is an
# act within W seconds after a talk beat to one destination; K cycle rounds
# to the SAME destination within the last R rounds fire once per streak
# (the streak ends when R rounds pass without a cycle). K, W and R are the
# eq values below: host.py reads them from this file (rhythm_params) and
# writes them on the line, so the line and the rule cannot disagree.
# M7.5 E2 (ADR-0007 Amendment M, lesson 2): the beats come from EVERY source
# the tree has, through host.py's act_beats and talk_beats: acts are the
# host's new children (above), the os source's Sysmon event 1 lines below
# the root (depth >= 1) at their UtcTime, and the hooks source's Bash calls
# at their ts; talks are the host's connections (above) and the os source's
# Sysmon event 3 lines at their UtcTime (destination "os:" + the first 12
# hex of the hash of the destination: the os source keeps none in clear).
# ADR-0007 AU-2 (M7.20): that hash is the server's (input_meta.dest_sha256:
# the address, the port and the protocol, without the host name Sysmon gives
# on some events and not on others; AW-2: the host watch's os follow asks
# os_sysmon for it, and no other reader of a machine writes it); AW-1: a host talk and an os
# talk to one server are two destinations, so one connection both sources
# saw is never two cycles on one destination.
# A source's beat is placed in the round whose interval holds its time;
# history lines of a source are not beats. The act_basis of a line names
# where its acts came from (started, stat, round, os, hooks).
kind: anchor
# ADR-0007 AT-1 (M7.18): an agent with no name, by what it does; nothing else of the rule changes by it.
severity: high
# Measured on SYNTHETIC fixtures only (K-9): the negatives are the four
# synthetic cases tests/fixtures/host/make.py makes from fake rounds:
# negative-two-cycles.json (K-1 cycles), negative-changing-destination.json
# (a new destination each turn), negative-acts-between-rounds.json (children
# that live between two rounds are never seen) and negative-no-talk.json
# (acts with no talk), and M7.5 E2 (re-measured, A6) negative-os-two-cycles.json
# (K-1 cycles of an os source). 0 of 5 fire; the budget is that measure, 0.
# ADR-0007 AP-3 (re-measured the same way, A6): with the quiet negatives
# negative-quiet-no-cycle.json (a tree quiet at the sample whose os source
# reads talks with no act) and negative-quiet-few-beats.json (the rig's
# shape: a long-lived tree's few beats, K-1 cycles, its last round still a
# quiet line), every round of each run judged (raqib/rules/fixturegen.py
# generate, at the declared k, w, r): 0 of the 9 measured negatives fire
# (the two quiet ones included; the synthetic desktops are not counted),
# and positive-quiet-three-cycles.json fires once, in its last round; the
# budget is that measure, 0. ADR-0007 AR-2 (re-measured the same way, A6):
# with negative-gone-few-beats.json (the same tree gone from the sample,
# its last K-1 cycles read on gone lines) 0 of the 10 measured negatives
# fire (`raqib check-rules`: 8 positive, 10 measured), and
# positive-gone-three-cycles.json fires once, in its last round, on a gone
# line; the budget is that measure, 0. ADR-0007 AU-4, AW-1 (re-measured
# the same way, A6): with negative-os-named-some.json (one server Sysmon
# names on some events and not on others, K-1 cycles) 0 of the 11 measured
# negatives fire (`raqib check-rules`: 9 positive, 11 measured), and
# positive-os-named-some.json fires once, in the round that reads the K-th
# cycle, to one destination; the budget is that measure, 0. The
# benign desktops' arrivals are not listed: a tree seen in one round cannot
# have a cycle. The field source - an IDE that polls one server and builds
# for hours - is the commander's to measure (as the act-root budget); until
# then this budget says nothing about it.
# ADR-0007 AT-1 corrected by Amendment AV, the field numbers on real agents (Qwen Code, opencode; GitHub's
# runners; the probe branch, never merged; these are not the budget's measure). Seven turns whose commands talk
# to no one: on Linux 2 of 2 agent trees fired, on the model server (the bytes of its one connection moved); on
# Windows 0 of 2 (the connection is kept open: one talk, the hole below). The earlier "7 of 8" counted the
# cycles of the commands themselves (a curl to one site in each turn). None of the runners' own trees fired;
# three short turns: none (fewer than K rounds).
fp_budget: 0.0
holes:
  - "a relay or proxy in between: the talk is the relay's (another process tree), so the tree that acts has no talk beat of its own"
  - "acts between rounds: a child that starts and ends between two rounds is counted only where the round reads the Sysmon channel (M7.9); elsewhere it is never seen and its cycle is not counted"
  - "a destination that changes each turn (a pool of model hosts, a CDN, DNS round robin) makes no K cycles to one destination"
  - "a child that is reparented away from the tree (a daemonised child, a service that runs the command) is not the tree's act"
  - "repeated talks on one long connection are unseen without bytes: where no byte counts are read (Windows, GetExtendedTcpTable; a Linux ss without -i counts) an established connection is one talk, when first seen, so an agent that keeps one connection open makes at most one cycle on it"
  - "a child start time that cannot be read (Linux /proc/PID/stat gone or hidden, an export's local CreationDate) places the act at the round's time, so W is as coarse as the round interval for it (a blind spot of the run)"
  - "bytes are recorded and compared, not judged by size: a talk is any change of the counts"
  - "a benign program that polls one server and spawns helpers (an IDE, an updater) has the same rhythm: a high finding, not a verdict (ADR-0007 AT-1); the commander's field measure on such a program (an IDE) is still owed"
  - "a tree the catalog names (by image or endpoint) is not judged by rhythm: an agent that takes a catalog agent's name escapes this rule (and is knocked as NEW-AGENT instead)"
  - "M7.5 E2, ADR-0007 AU-2, AW-1: the os source's destination is the hash of the server (address, port, protocol: input_meta.dest_sha256), so one server is one os destination whether or not Sysmon named the host; an os talk and a host talk to one server are two destinations (one connection both sources saw is one talk on each, never two cycles on one); another address of one server (an address pool, DNS round robin, IPv4 and IPv6 of one name) is another destination, and so is another protocol to it (tcp and udp on one port); two servers behind one address and port (a content network's edge, a forward proxy) are one destination (AX-3); an os net line without dest_sha256 (written before it, by a caller that did not ask for it, or whose address, port or protocol did not parse) keeps the hash of (hostname, ip, port, protocol), so one server named on some of those lines and not on others is two destinations, and such a line and a line with the key to one server are two destinations too (said once per source object, os or hooks, with its count; a source attached again says it again)"
  - "M7.5 E2: several cycles inside one round's interval count as one (each act round counts once per destination), so an os source that sees a fast agent's every turn still counts at most one cycle per round"
  - "ADR-0007 AP-2, AR-1: a tree not in the round (quiet, kept or gone) has a line only in a round its source gained a beat; its ring still has one entry for every round from its first line on that reached its sample (an empty one, with that round's own interval, for a round with no line), so a beat goes to the round whose interval holds it and a cycle cites that round (no seq where it had no line); several cycles inside one round's interval still count as one. AS-1: a round that ended before its sample has no entry (its beats are in the next round's entry, whose interval holds them: R rounds can be fewer than R entries), and a beat older than the ring's oldest interval (a follow that is late or attached again) is put into the oldest entry and counted in the window"
  - "ADR-0007 AP-3: a quiet or gone tree with no source of its own (no os follow, no hooks trace: the host source only) has no beat between samples and no line: its cycles between samples, and in its last intervals, are not seen"
  - "ADR-0007 AP-3, AR-2: a source's beats are counted one round late; a gone tree's beats a round reads are judged on its gone line, but the beats the final poll reads after the last round (of a tree alive at the end, of one whose os follow was stopped in the last round or two, or of a gone tree on a hooks trace another session still writes) are in no round: counted per tree and said in the report (RHYTHM BEATS), never judged"
  - "ADR-0007 AS-5: the hooks source is the project's trace, not the tree's: every tree attached to it reads every session's Bash calls in that project as its own acts (a candidate, a quiet and a gone tree alike: a gone tree goes on having lines while another session in the project runs a command), each cited exactly, by the line of the session that made it"
  - "ADR-0007 AS-6: the seams of a source's life: an os follow that is stopped (its tree gone) makes no last pass, so the events between its last pass and its stop are in no source; a tree attached again (gone for one round and back, a follow that ended) loses the beats its earlier source held that no round had read (one round's at most); a quiet tree that a round with an empty process sample calls gone is attached again only when it is next a candidate"
  - "ADR-0007 AY-1 as AZ-1 to AZ-4 corrected it: every process goes to its nearest talking ancestor (the inventory's anchor), except a child the round's process sample shows with the root of a tree the watch holds as quiet or kept (its key, its root in the round's process sample) strictly above it on its path: it is that tree's, the held root nearest it; the held root itself stays its parent's act. It is given only where that tree's host record could be written when the round began (else it stays where the inventory put it, is judged there, and a held-not-given hole says so once for the tree; a child given in a round whose write then fails is given back and judged there from the next round; an os follow's host record is tried again every round and its failed write does not stop the giving), and a child once given is new on no other tree while its pid is in the sample. Not covered: the giving covers the sample's children only - where the ancestor has an os follow, that follow writes every event as before and marks (ADR-0007 BC-1, BC-2: input_meta.under_root, the root's pid) each event at or under the root of another tree the watch holds with an os follow of its own, the root told and matched by its ProcessGuid, while that follow lives (read when the ancestor's follow asks) and the round's process sample shows that root under the ancestor's; the root's own event 1 is not marked and stays the ancestor's act; a marked line gives the ancestor no act, no talk and no destination (BC-3), and its findings (NET-TOOL) are judged as before, one act judged once. What the mark costs (BC-5): a marked line whose twin the other tree's file does not hold (the other follow's last interval before it stopped, a follow that died, a member the other follow never knew) gives no beat to either tree, so the rhythm of an agent's last seconds can be missed (its commands are still judged where they are written); a process born under the root before the root was told is marked from then on (the follow's own parents tell); a root with no ProcessGuid is not told, and the ancestor then counts its child's commands as before (on Windows with Sysmon the false cycles remain there); every os follow under the host watch keeps one more map (each member's parent by ProcessGuid) for the life of the follow; a tree whose root is not in the sample (gone: its orphans that were never given go to the nearest talking ancestor, and that ancestor's talks and their acts can still make its cycles); a round with no process sample; a file write (the inventory gives it no path, so it stays the talking ancestor's); two held trees of one root pid (neither is given); two processes of one pid in one inventory (a path holds the system's pids, so they are not told apart on it)."
  - "ADR-0007 AY-3: a quiet tree's acts with no talk seen make no cycle: an agent whose connection to its model is open only between two samples, where no source sees a connection between samples (Linux), is still not found by rhythm; where a sample saw it talk it is found as an arrival, and the commands of it that the sample shows are its own tree's acts, judged there (NET-TOOL, DESTRUCT-CMD) where its host record can be written (else on the talking ancestor, as before). The talking ancestor keeps the act of the agent's root (the agent is its child) and stays what the inventory made it: a candidate, and, where it is new, an arrival like any other; an agent started anew for each job gives it one act for each new root. An agent no sample ever saw talking is no tree, is not held, and its commands stay the talking ancestor's, with the cycles they make there (ADR-0007 BA-2)."
description: "A line of raqib watch --host (tool HostTree, source os) for a candidate tree, or (ADR-0007 AP-2, AQ-2, AR-2) a tree not in the round - quiet at the sample, kept by a round that could not read the connections, or gone - whose source gained a beat (its class its own state; AR-3: such a line carries no acts, endpoints or cites of an earlier sample, and its rhythm names the beats its round read: read_talks, read_acts, read_cites), whose think-act cycle reached K cycles to one destination within the last R rounds: in K rounds a child of the tree started within W seconds after the tree talked to the same remote host:port (a connection new in the round, or one whose bytes moved: input_meta.rhythm, computed by raqib/host.py from the rounds' records; K, W and R are this rule's own eq values). The sources of the beats (M7.5 E2): acts from the host's children, the os source's Sysmon event 1 (UtcTime) and the hooks source's Bash calls; talks from the host's connections and the os source's Sysmon event 3 (UtcTime), whose destination is the server's hash (ADR-0007 AU-2: input_meta.dest_sha256, the address, the port and the protocol, which the host watch's os follow asks for, AW-2; a line without it keeps the hash of the host name too, said once per source); a host talk and an os talk to one server are two destinations (AW-1). It fires once per streak (input_meta.rhythm.fires); the streak ends when R rounds pass without a cycle. Only an UNKNOWN tree is judged (ADR-0007 decision 4: input_meta.named false); a benign program is unknown to the catalog and is judged too: the rhythm is the tree's, not its name's. A tree there at the start that cycles under the watch fires: the cycle is live (K-10). The line cites the rounds and the record lines of each beat (A5): AR-1, the ring has an entry for every round from the tree's first line on, so a beat is in the round whose interval holds it, and a round with no line is cited with no seq. Out of reach: a tree with no source of its own between samples, the beats read after the last round (counted, said), and the seams of a source's life (AS-5, AS-6: holes). ADR-0007 AY-1, AY-2 as AZ corrected them: every process goes to its nearest talking ancestor, except a child the round's process sample shows with the root of a tree the watch holds (quiet or kept, its root in the sample) strictly above it: that tree has it, in its own host record where that record can be written in the round (else it stays where the inventory put it and is judged there, said once) and as an act beat of its ring, and stays quiet; the held root itself stays its parent's act. So a talking ancestor (a CI runner's worker) is not given, from the sample, the children of an agent under it whose connection was closed at the sample (AX-4), and they make none of its cycles from the sample (AY-3: the agent's acts with no talk seen make none); where the ancestor has an os follow, that follow writes the agent's events too and marks each one at or under the root of a tree the watch holds with an os follow of its own (input_meta.under_root, matched by ProcessGuid, while that follow lives and the sample shows the root under the ancestor's: ADR-0007 BC-1, BC-2), and a marked line gives the ancestor's ring no beat (BC-3); an event it does not mark is the ancestor's beat as before (not covered: a hole, BC-5)."
summary: "{input_meta.named_word} tree {input_meta.image} pid {input_meta.pid}: {input_meta.rhythm.cycles} talk-then-act cycles to {input_meta.rhythm.destination} in the last {input_meta.rhythm.r} rounds (round {input_meta.round})"
match:
  all:
    - {field: tool, exists: true}
    - {field: tool, eq: HostTree}
    - {field: source, eq: os}
    # ADR-0007 AP-2, AQ-2: a tree not in the round (quiet at the sample, or kept by a round that could not read the
    # connections) whose source gained a beat has its line too, its class its own state: a beat is judged in the
    # round that reads it.
    # ADR-0007 AR-2: and a tree that is gone whose source still gained a beat (class gone), in the round that reads it.
    - {field: input_meta.class, in: [candidate, quiet, kept, gone]}
    # ADR-0007 decision 4: the unknown is judged by rhythm (a tree the catalog names is NEW-AGENT's).
    - {field: input_meta.named, eq: false}
    - {field: input_meta.rhythm.fires, eq: true}
    - {field: input_meta.rhythm.k, eq: 3}
    - {field: input_meta.rhythm.w, eq: 30}
    - {field: input_meta.rhythm.r, eq: 10}
    # M7.6c REDO E-3 (ADR-0008 Amendment E): how often the suspect layer is asked is not a condition of this rule;
    # it is the watch's option (`raqib watch --host --suspect-every N`, the window's field; default 10 rounds).
fixtures:
  positive:
    - tests/fixtures/rules/HOST-RHYTHM/positive-three-cycles.json
    - tests/fixtures/rules/HOST-RHYTHM/positive-os-three-cycles.json
    - tests/fixtures/rules/HOST-RHYTHM/positive-os-talks-host-acts.json
    - tests/fixtures/rules/HOST-RHYTHM/positive-host-talks-os-acts.json
    # ADR-0007 AP-3: a tree quiet at the sample whose os source reads k cycles between samples
    - tests/fixtures/rules/HOST-RHYTHM/positive-quiet-three-cycles.json
    # ADR-0007 AR-2: the same tree gone from the sample, its k-th cycle read after it is gone (a gone line)
    - tests/fixtures/rules/HOST-RHYTHM/positive-gone-three-cycles.json
    # ADR-0007 AU-4: AU-1, one server Sysmon names on some events and not on others (k cycles, one destination)
    - tests/fixtures/rules/HOST-RHYTHM/positive-os-named-some.json
    # M7.6c REDO E-2 (ADR-0008 Amendment E): the edge pairs of W and R (raqib/rules/fixturegen.py): an act exactly
    # W s after its talk, a first cycle that is the oldest of the last R rounds
    - tests/fixtures/rules/HOST-RHYTHM/positive-w-edge.json
    - tests/fixtures/rules/HOST-RHYTHM/positive-r-edge.json
  negative:
    - tests/fixtures/rules/HOST-RHYTHM/negative-two-cycles.json
    - tests/fixtures/rules/HOST-RHYTHM/negative-changing-destination.json
    - tests/fixtures/rules/HOST-RHYTHM/negative-acts-between-rounds.json
    - tests/fixtures/rules/HOST-RHYTHM/negative-no-talk.json
    - tests/fixtures/rules/HOST-RHYTHM/negative-os-two-cycles.json
    # AP-3: a quiet tree whose beats make no cycle (talks only); the rig's shape, a few beats (k-1 cycles)
    - tests/fixtures/rules/HOST-RHYTHM/negative-quiet-no-cycle.json
    - tests/fixtures/rules/HOST-RHYTHM/negative-quiet-few-beats.json
    # AR-2: a gone tree whose last k-1 cycles are read after it is gone
    - tests/fixtures/rules/HOST-RHYTHM/negative-gone-few-beats.json
    # AU-4: the same with k-1 cycles
    - tests/fixtures/rules/HOST-RHYTHM/negative-os-named-some.json
    # E-2: an act W+1 s after its talk; a first cycle one round out of the last R rounds
    - tests/fixtures/rules/HOST-RHYTHM/negative-w-edge.json
    - tests/fixtures/rules/HOST-RHYTHM/negative-r-edge.json
# M7.6c (ADR-0008 Amendment B): the thresholds a person may set (raqib rules --threshold, the Rules panel)
# and within what. Every value is measured before it is allowed (raqib/overlay.py measure): the fixtures
# above are generated at it by raqib/rules/fixturegen.py, with the benign desktops' arrivals; a value under
# which a positive does not fire, a negative or an arrival fires, or the budget is broken is refused.
# M7.6c REDO (ADR-0008 Amendment E): editable only with an edge pair (E-2: k, w and r have one); the measure
# accepts k 2..r-2 and r >= k+2 (E-6, shown by `raqib rules`); r stops at 200: the measure's cost grows with
# r squared (r=1000: about a minute per change), so the fence is where a change is measured in seconds. With the
# edge negatives of W and R the measured negatives are 7, 0 of 7 fire (the synthetic desktops are not counted);
# with AP-3's two quiet negatives they are 9, 0 of 9 fire; with AR-2's gone negative they are 10, 0 of 10 fire;
# with AU-4's one (one server named on some events and not on others) they are 11, 0 of 11 fire.
bounds:
  k: {min: 1, max: 100}
  w: {min: 1, max: 3600}
  r: {min: 1, max: 200}
  relations:
    - "k <= r"
