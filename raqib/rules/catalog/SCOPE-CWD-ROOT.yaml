# Session without a project boundary (review M1.1 PA1).
id: SCOPE-CWD-ROOT
title: Session runs from the file system root or a home directory
class: SCOPE
attack: []
attack_note: "a rule about the agent's own work or the watch's own sight, not a technique"
# ADR-0002: measured against the cwd as the hook captured it.
kind: anchor
severity: medium
fp_budget: 0.1
description: "SCOPE-PATH measures paths against the session's cwd. A cwd of /, a broad top-level directory such as /tmp or /home, a home directory (/root, /home/<user>, /Users/<user>, /var/root) or a WSL drive puts almost every path inside, so the project boundary is gone. On Windows the same holds for a drive root (C:\\), C:\\Users, a home (C:\\Users\\<name>), C:\\Windows, C:\\Windows\\Temp, C:\\Temp, C:\\Program Files, C:\\Program Files (x86), C:\\ProgramData, a home's AppData\\Local\\Temp and a UNC share root (\\\\server\\share), on any drive, in any case, with \\ or /, also behind a \\\\?\\ or \\\\.\\ prefix (\\\\?\\C:\\Users\\<name>, \\\\?\\UNC\\server\\share; ruling M5.1b C-9). A home directory elsewhere is not known to this rule. A cwd on neither list is a judged negative, on Windows as on POSIX (ruling M5.1b C-1). Known holes: the list omits other broad directories such as /etc, /usr and /var; and a nested session, one the agent starts itself, chooses its own cwd. On both branches the cwd is matched as written, not normalised (ruling M5.1b C-15): a cwd with . or .. inside it, such as C:\\.\\Users, C:\\proj\\.., /tmp/../home or /home/alice/proj/.., is a judged negative even where it names a listed directory. Windows: C:\\Users\\Public counts as a home, but the shared folders under it (Public\\Documents, Public\\Desktop) are not listed; a home redirected to OneDrive is not known; a junction (C:\\Documents and Settings), a subst drive or an 8.3 short name (C:\\PROGRA~1) names a listed directory by a path the list does not hold, since cwds are compared as written, not resolved. A UNC path is recognised by its two leading backslashes only (ruling M5.1b C-12): the forward-slash form //server/share is read as the POSIX path /server/share, which neither branch lists. WSL: /mnt/c/Users/x and C:\\Users\\x are different cwds (ruling Q-6), and from WSL only /mnt/<drive> and /mnt/<drive>/Users/<name> are listed, not /mnt/c/Windows, /mnt/c/Temp or /mnt/c/Program Files; the Git Bash form /c/Users/<name> is not listed either. macOS: the list ignores case, but the other path rules compare POSIX paths case-sensitively, and the macOS temporary directories (/private/tmp, /var/folders/...) are not listed."
summary: "session cwd {cwd} gives no project boundary"
match:
  all:
    - {field: phase, in: [pre, session_start]}
    - any:
        # POSIX: /, a broad top-level directory, a home directory, or a WSL drive
        # or home; any case (macOS); a trailing / or /. is allowed.
        - field: cwd
          regex: '(?i)^/(?:(?:root|home|users|tmp|mnt|media|srv|opt|var/tmp|var/root)|(?:home|users)/[^/]+|mnt/[a-z](?:/users/[^/]+)?)?(?:/\.)?/?$'
        # Windows (ruling M5.1b C-1), a second branch: a drive root, Users, a home,
        # Windows, Windows\Temp, Temp, Program Files, Program Files (x86),
        # ProgramData, a home's AppData\Local\Temp, or a UNC share root; any case;
        # \ or / between names; a trailing \, / or \. is allowed. A \\?\ or \\.\
        # prefix may stand before the drive, and \\?\UNC\ (or \\.\UNC\) before
        # server\share, as norm_path strips them (ruling M5.1b C-9).
        - field: cwd
          regex: '(?i)^(?:(?:\\\\[?.]\\)?[a-z]:(?=[\\/])(?:[\\/]+(?:(?:users|windows|temp|program files|program files \(x86\)|programdata|windows[\\/]+temp)|users[\\/]+[^\\/]+(?:[\\/]+appdata[\\/]+local[\\/]+temp)?))?|(?:\\\\|\\\\[?.]\\unc\\)[^\\/]+[\\/]+[^\\/]+)(?:[\\/]+\.)?[\\/]*$'
aggregate: {distinct: cwd, over: 0, as: path, cite: first}
fixtures:
  positive:
    - tests/fixtures/rules/SCOPE-CWD-ROOT/positive-root-and-home.json
    - tests/fixtures/rules/SCOPE-CWD-ROOT/positive-windows-roots.json
  negative:
    - tests/fixtures/rules/SCOPE-CWD-ROOT/negative-project-dir.json
    - tests/fixtures/rules/SCOPE-CWD-ROOT/negative-windows-project-dirs.json
