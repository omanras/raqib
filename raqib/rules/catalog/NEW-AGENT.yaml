# A tree that talks and acts appears on the host (M7.2, ADR-0007 decision 2).
id: NEW-AGENT
title: An agent tree appears on the host
# No HOST class exists in engine.CLASSES (raqib/rules/engine.py is outside
# M7.2's Scope): SCOPE, an agent nobody named is outside what is watched
# (docs/review/2026-11-04-M7.2-questions.md, Q-4).
class: SCOPE
# ADR-0002: measured against the host's own record (process tree and TCP
# table, read by raqib/discover.py), which the agent does not write.
kind: anchor
severity: high
# Benign desktops start trees that talk and have a child (an IDE terminal, a
# browser): ADR-0004 B-8 says the budget comes from the field; 0.25 as the
# act_root block's, until a field run measures it.
fp_budget: 0.25
holes:
  - "Linux /proc gives no creation time: a tree is keyed by (pid, image), so a pid reused by a process of the same image between rounds is taken for the same tree"
  - "a tree that lives only between two rounds (shorter than T seconds) is never seen"
  - "a tree whose talk and act fall in different rounds is never a candidate in one round (the round reads one sample)"
  - "a tree that was a candidate earlier in this watch and comes back with the same pid, image and creation time is not new again (once per tree)"
  - "every hole of raqib discover (liveness, sibling talkers, reparented acts, TCP only, one view) is a hole of this rule"
description: "A line of raqib watch --host (tool HostTree, source os) for a candidate tree of a round's inventory - a process tree that talks to a remote host and has a child or writes outside config space (ADR-0004) - that was not a candidate in any earlier round of this watch and is not history. History (ADR-0005 B-3): the trees of the first round with an inventory were there at the start; they are listed, never knocked. An act-root that becomes a candidate is new as a candidate. A tree is keyed by (root pid, image name, creation time where the reader gives one). The line carries named or unknown: named when the catalog (raqib/discover/endpoints.yaml) knows the image or an endpoint it talks to; an unknown agent is a finding, never a nothing. The line cites the round, the sample and the record lines of the inventory (A5)."
summary: "{input_meta.named_word} agent tree {input_meta.image} pid {input_meta.pid} (round {input_meta.round}, was {input_meta.was})"
match:
  all:
    - {field: tool, exists: true}
    - {field: tool, eq: HostTree}
    - {field: source, eq: os}
    - {field: input_meta.class, eq: candidate}
    - {field: input_meta.history, eq: false}
    - {field: input_meta.candidate_before, eq: false}
fixtures:
  positive:
    - tests/fixtures/rules/NEW-AGENT/positive-new-unknown.json
    - tests/fixtures/rules/NEW-AGENT/positive-new-named.json
    - tests/fixtures/rules/NEW-AGENT/positive-act-root-becomes-candidate.json
  negative:
    - tests/fixtures/rules/NEW-AGENT/negative-history-only.json
    - tests/fixtures/rules/NEW-AGENT/negative-gone-and-back.json
    - tests/fixtures/rules/NEW-AGENT/negative-act-root-only.json
