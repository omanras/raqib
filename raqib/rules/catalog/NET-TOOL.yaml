# Network access from a tool call (ADR-0001 section 4, M1.1).
id: NET-TOOL
title: Tool call reaches the network
class: NET
# ADR-0002: the shape of a bad act (a tool, a program name), so it lists its evasions.
kind: signature
evasion:
  - "python urllib: the program is python"
  - "pip/npm install: package managers are not on the list"
  - "git fetch: git is not on the list (nor git clone or git push)"
  - "node fetch: the program is node"
  - "a wrapper in front (sudo, env, xargs, timeout, nohup, exec, eval, source, find -exec), a shell other than bash or sh (zsh -c, dash -c), or a bash -c inside a bash -c: the program it runs is an argument, and capture never records arguments"
  - "a network program not on the list (dig, nslookup, gh, docker pull)"
  - "host source (M7.2b, tool HostChild): a child that lives only between two rounds of raqib watch --host is never seen; a network program renamed (a copy of curl called x) is matched by its image name only; a network call made by the tree's own process (a library, no child) is a HostConnection line, which this rule does not judge"
  - "os source (M7.8, tool process, Sysmon event 1), judged by input_meta.image (discover's normalised image name, curl.exe -> curl): still unseen are a PowerShell cmdlet (Invoke-WebRequest, Invoke-RestMethod, Start-BitsTransfer, and Windows PowerShell 5.1's curl and wget, which are aliases of Invoke-WebRequest), which runs inside the shell's own process; a shell builtin, which starts no process; a renamed copy of a network program (curl.exe copied as x.exe is x); the destination, which is an argument (the command line is hashed, never written); a network call by the tree's own process (an os net line, which this rule does not judge); a program certutil, mshta, msiexec or regsvr32 fetches with, by an argument (not on the list); a listed program run inside WSL (wsl.exe: a Linux curl creates no Windows process) or as an argument of a multicall binary (busybox curl), which is the unlisted image; an agent that reaches the network through git (ssh whose parent_image is git is git over SSH, left out as git is on every source: M7.8 REDO R-7; the parent is known by its name only, so any program named git.exe that starts ssh.exe is left out, and real git starts ssh with what the agent configures - core.sshCommand, GIT_SSH_COMMAND - so a tunnel or a remote command through git is git's: REDO 2 T-7); and a process line written before M7.8, which has no image (the rule says it could not judge it; the host watch says so once per source)"
  - "a tool whose URL is in a field not named url: url_host is read from url only"
  - "a command capture cannot read in full is matched by command_head only (capture marks it command_unread: true; a trace written before M4.2 has neither field). Capture gives up on: a command that is not a string or is over 65536 characters; more than 64 programs; $(...) nested more than 8 deep; a program word that is not literal ($X, $(...), a backtick, a glob, a brace expansion, $'...') or not a plain name (or one that looks like a key); an expansion among the options of bash or sh, or a $ or a backtick in a bash -c string; for, case, select, function, coproc, [[ ]], (( )) and $(( )); a function definition or an array assignment; a process substitution <(...) or >(...); a backtick anywhere; a quote or $ inside ${...}; an unquoted here-document holding $( or a backtick, or one with no end line; a syntax error (unbalanced quotes or parentheses, a stray ) or ;;, a word after a subshell, a redirection with no target)"
  - "code given to a shell on stdin, by a here-document or a here-string, or in a script file (echo '...' | sh, bash <<EOF, bash <<< '...', bash x.sh, ./x.sh) records the shell or the script only: its code is not read (since M4.2b the script's basename is input_meta.command_scripts, ruling G-2)"
severity: medium
# Doc lookups and package fetches are routine, so some benign sessions fire.
fp_budget: 0.25
description: "A web tool, a URL in the tool input, or a Bash command one of whose programs talks to the network: the first program (command_head) or, when capture could read the whole command, any program in it (command_programs, M4.2). Network access can carry data out or bring code in. Since M4.2b (ruling E-12) command_head skips leading redirections and their targets (`2>/dev/null rm x` has the head rm). Known hole: a line written before M4.2b kept the old head (null there), and one written before M4.2 has no command_programs to read it right, so such an old line is still missed. Note (2026-11-03, M5.3, ADR-0003 Amendment C, C-5): a line of the os source (source: os) is not judged; the os source's network lines (tool net) are for a later rule. Note (2026-11-10, M7.8, ADR-0007 Amendment P, P-1): an os process line (source: os, tool process, Sysmon event 1) is judged by input_meta.image, the image name in discover's normalised form, against the same list, which gains the Windows network programs (bitsadmin, tftp, finger, plink, pscp, psftp, winscp); a process line written before M7.8 has no image and is not judged (partial); the os net and file lines are still not judged here. Note (2026-11-04, M7.2b, ADR-0007 Amendment H-2): a line of the host source (source: host) is judged when its tool is HostChild, by the image names of the tree's new children (input_meta.command_programs); its HostConnection and HostGone lines are not judged here."
summary: "{tool} may reach the network at seq {seq} (host {input_meta.url_host}, program {input_meta.command_head}, programs {input_meta.command_programs})"
match:
  all:
    - {field: phase, eq: pre}
    - any:
        # M7.8 (ADR-0007 Amendment P, P-1): a line of the os source (Sysmon event 1,
        # tool process) is judged by input_meta.image, the image name in discover's
        # one normalised form (curl.exe -> curl). A process line written before
        # M7.8 has no image: the rule cannot judge it (partial), never guesses it.
        # Its net lines (tool net) and file lines are still not judged here.
        - all:
            - {field: source, eq: os}
            - {field: tool, eq: process}
            - field: input_meta.image
              in: [curl, wget, nc, ncat, netcat, socat, telnet, ssh, scp, sftp, rsync, ftp, aria2c, http, https, xh, lynx, links, w3m, bitsadmin, tftp, finger, plink, pscp, psftp, winscp]
            # M7.8 REDO R-7 (ADR-0007 Amendment R): ssh started by git is git over SSH,
            # which this rule leaves out on every source (input_meta.parent_image).
            - not:
                all:
                  - {field: input_meta.image, eq: ssh}
                  - {field: input_meta.parent_image, eq: git}
        - all:
            # M5.3 (ADR-0003 Amendment C, C-5): no other os line is judged here; a
            # line with no source (written before M5.2) is a hook line and is judged.
            - any:
                - {field: source, exists: false}
                - {field: source, ne: os}
            - any:
                - {field: tool, in: [WebFetch, WebSearch]}
                - {field: input_meta.url_host, exists: true}
                # M7.2b (ADR-0007 Amendment H-2): a line of the host source (the host's
                # own record of a discovered tree), tool HostChild, whose new children
                # include a network program by image name. Never labelled Bash.
                - all:
                    - {field: source, eq: host}
                    - {field: tool, eq: HostChild}
                    - {field: input_meta.command_programs, exists: true}
                    - field: input_meta.command_programs
                      has_any: [curl, wget, nc, ncat, netcat, socat, telnet, ssh, scp, sftp, rsync, ftp, aria2c, http, https, xh, lynx, links, w3m, bitsadmin, tftp, finger, plink, pscp, psftp, winscp]
                - all:
                    - {field: tool, eq: Bash}
                    - any:
                        - field: input_meta.command_head
                          in: [curl, wget, nc, ncat, netcat, socat, telnet, ssh, scp, sftp, rsync, ftp, aria2c, http, https, xh, lynx, links, w3m, bitsadmin, tftp, finger, plink, pscp, psftp, winscp]
                        # M4.2 (ruling D-3): every program of the command, guarded so a
                        # line without command_programs is judged by command_head alone.
                        - all:
                            - {field: input_meta.command_programs, exists: true}
                            - field: input_meta.command_programs
                              has_any: [curl, wget, nc, ncat, netcat, socat, telnet, ssh, scp, sftp, rsync, ftp, aria2c, http, https, xh, lynx, links, w3m, bitsadmin, tftp, finger, plink, pscp, psftp, winscp]
fixtures:
  positive:
    - tests/fixtures/rules/NET-TOOL/positive-curl.json
    - tests/fixtures/rules/NET-TOOL/positive-webfetch.json
    - tests/fixtures/rules/NET-TOOL/positive-programs.json
    - tests/fixtures/rules/NET-TOOL/positive-host-child.json
    - tests/fixtures/rules/NET-TOOL/positive-os-process.json
  negative:
    - tests/fixtures/rules/NET-TOOL/negative-local.json
    - tests/fixtures/rules/NET-TOOL/negative-programs.json
    - tests/fixtures/rules/NET-TOOL/negative-host-child.json
    - tests/fixtures/rules/NET-TOOL/negative-os-process.json
