# Network access from a tool call (ADR-0001 section 4, M1.1).
id: NET-TOOL
title: Tool call reaches the network
class: NET
# ADR-0002: the shape of a bad act (a tool, a program name), so it lists its evasions.
kind: signature
evasion:
  - "python urllib: the program is python"
  - "pip/npm install: package managers are not on the list"
  - "git fetch: git is not on the list (nor git clone or git push)"
  - "node fetch: the program is node"
  - "bash -c 'curl ...' or a wrapper in front (sudo, env, xargs): only the first program is read"
  - "curl after &&, ; or a pipe: only the first program is read"
  - "a network program not on the list (dig, nslookup, gh, docker pull)"
  - "a tool whose URL is in a field not named url: url_host is read from url only"
severity: medium
# Doc lookups and package fetches are routine, so some benign sessions fire.
fp_budget: 0.25
description: "A web tool, a URL in the tool input, or a Bash command whose program talks to the network. Network access can carry data out or bring code in."
summary: "{tool} may reach the network at seq {seq} (host {input_meta.url_host}, program {input_meta.command_head})"
match:
  all:
    - {field: phase, eq: pre}
    - any:
        - {field: tool, in: [WebFetch, WebSearch]}
        - {field: input_meta.url_host, exists: true}
        - all:
            - {field: tool, eq: Bash}
            - field: input_meta.command_head
              in: [curl, wget, nc, ncat, netcat, socat, telnet, ssh, scp, sftp, rsync, ftp, aria2c, http, https, xh, lynx, links, w3m]
fixtures:
  positive:
    - tests/fixtures/rules/NET-TOOL/positive-curl.json
    - tests/fixtures/rules/NET-TOOL/positive-webfetch.json
  negative:
    - tests/fixtures/rules/NET-TOOL/negative-local.json
