# Secret-like string in a tool's output (ADR-0001 section 4, M1.2).
id: SECRET-OUTPUT
title: Secret-like string in a tool's output
class: SECRET
# ADR-0002: the shape of a bad act (a secret pattern in output), so it lists its evasions.
kind: signature
evasion:
  - "base64/hex the output: the patterns see encoded text"
  - "split it: no part matches a whole pattern"
  - "read without echo: a secret that never reaches a tool's output is not scanned"
  - "a secret of a kind capture has no pattern for"
  - "glue a placeholder marker into the match (KEYtest, or KEY_test and KEY-example where the pattern takes _ and -): it counts as a placeholder (placeholder_kinds), which no rule reads"
  - "put it past capture's scan budget, 1048576 characters over all strings of tool_response and error (keys too, each its length + 1, in order): unscanned; with nothing found before it, the post is only a partial note"
severity: high
fp_budget: 0.05
description: "Capture names the secret patterns a tool's output matched (output_meta.secret_kinds); the text itself is never stored. A secret in output means the agent now holds it and can pass it on. Note (2026-11-03, M5.3, ADR-0003 Amendment C, C-5): a line of the os source (source: os) is not judged: an os event has no output, and its post carries output_meta {}."
summary: "{tool} output at seq {seq} matched {output_meta.secret_kinds}"
match:
  all:
    - {field: phase, eq: post}
    # M5.3 (ADR-0003 Amendment C, C-5): os lines are not judged here; a line
    # with no source (written before M5.2) is a hook line and is judged.
    - any:
        - {field: source, exists: false}
        - {field: source, ne: os}
    - {field: output_meta.secret_kinds, nonempty: true}
fixtures:
  positive:
    - tests/fixtures/rules/SECRET-OUTPUT/positive-aws-key-in-cat.json
    - tests/fixtures/rules/SECRET-OUTPUT/positive-failure-message.json
  negative:
    - tests/fixtures/rules/SECRET-OUTPUT/negative-clean-output.json
