# Scope drift: edits spread outside the task's declared scope (ADR-0001 section 4, M1.2).
id: DRIFT-FILES
title: Edits spread outside the declared scope
class: DRIFT
severity: medium
fp_budget: 0.1
description: "In one session, edits touch more than 2 distinct files outside the paths of context 'scope' (for example the Scope: list of a HANDOFF). Without a scope the rule is not evaluated, and says so."
summary: "{count} distinct files edited outside the declared scope; last {input_meta.path} at seq {seq}"
match:
  all:
    - {field: phase, eq: pre}
    - {field: tool, in: [Write, Edit, MultiEdit, NotebookEdit]}
    - {field: input_meta.path, outside_any: scope}
aggregate: {distinct: input_meta.path, over: 2}
fixtures:
  positive:
    - tests/fixtures/rules/DRIFT-FILES/positive-three-files.json
  negative:
    - tests/fixtures/rules/DRIFT-FILES/negative-in-scope.json
    - tests/fixtures/rules/DRIFT-FILES/negative-two-files.json
